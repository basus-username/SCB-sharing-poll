<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>YouVote 2.0</title>
<meta name="description" content="Quickest group polls" />

<meta property="og:title" content="YouVote 2.0" />
<meta property="og:description" content="Quickest group polls" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://scb-youvote-pikachew.vercel.app/" />
<!-- Deliberately the 192px icon, not 512: WhatsApp/FB-style link-preview
     scrapers switch from a small "summary" card (icon + text side by side,
     like YouVote 1.0's link) to a big "summary_large_image"-style card
     once the declared og:image is large/square enough — 512x512 was
     tipping it into the big-banner treatment. 192x192 is still sharp on
     any screen that shows it small, but reads as a compact icon rather
     than a giant square. DO NOT bump this back to icon-512.png without
     checking the WhatsApp preview on-device first. -->
<meta property="og:image" content="https://scb-youvote-pikachew.vercel.app/icons/icon-192.png" />
<meta property="og:image:width" content="192" />
<meta property="og:image:height" content="192" />
<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="YouVote 2.0" />
<meta name="twitter:description" content="Quickest group polls" />
<meta name="twitter:image" content="https://scb-youvote-pikachew.vercel.app/icons/icon-192.png" />

<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#141319" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="YouVote 2.0" />
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
<link rel="icon" href="/icons/icon-192.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141319;
    --surface:#1E1C27;
    --surface-2:#2E2A3D;
    --border:#4E4768;
    --text:#F5F3FA;
    --text-muted:#A39DB8;
    --violet:#A594F5;
    --violet-dim:#332C4D;
    --violet-tint:#251F38;
    --gold:#EFB65C;
    --gold-dim:#4A3820;
    --rose:#E88989;
    --rose-dim:#4A2A2A;
    --green:#7FCB98;
    --radius:16px;
    --radius-sm:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    padding-bottom:60px;
  }
  .num{font-family:'JetBrains Mono',monospace;font-weight:700;font-variant-numeric:tabular-nums;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:600;}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;}
  ::selection{background:var(--violet-dim);}

  #app{max-width:560px;margin:0 auto;padding:8px 16px 40px;}

  /* ---------- permanent undo fab ----------
     Lives bottom-right, floating above content, so it never competes with
     the topbar (brand name, voter chip) for space. It's a single tappable
     pill — icon + label together — so there's no hover-only tooltip that's
     unusable on a touchscreen. */
  .undo-fab{
    position:fixed;bottom:18px;right:16px;z-index:80;
    display:flex;align-items:center;gap:8px;
    border:1px solid var(--gold);background:var(--gold-dim);color:var(--gold);
    border-radius:24px;padding:8px 14px 8px 8px;font-size:12.5px;font-weight:600;
    box-shadow:0 4px 16px rgba(0,0,0,0.4);
    opacity:0;transform:translateY(8px) scale(0.96);pointer-events:none;
    transition:opacity .18s,transform .18s;
  }
  .undo-fab.active{opacity:1;transform:translateY(0) scale(1);pointer-events:auto;}
  .undo-fab:active{transform:scale(0.95);}
  .undo-fab-icon{
    width:26px;height:26px;border-radius:50%;background:rgba(239,182,92,0.18);
    display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0;
  }
  .undo-fab-text{max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}

  .topbar{
    display:flex;align-items:center;justify-content:space-between;
    padding:6px 2px 14px;
  }
  .brand{display:flex;align-items:center;gap:9px;text-decoration:none;}
  .brand-mark{
    width:30px;height:30px;border-radius:8px;overflow:hidden;
    display:flex;align-items:center;justify-content:center;flex-shrink:0;
    /* Optical nudge, not a real misalignment: the two-line text block
       (name + credit) has more visual weight toward its bottom half than
       a flexbox's geometric center accounts for, so a perfectly
       align-items:center icon reads as sitting a hair too high next to
       it. 1px down-shift is enough to fix the illusion without being
       visible as its own thing. */
    transform:translateY(1px);
  }
  .brand-mark img{width:100%;height:100%;object-fit:cover;display:block;}
  .brand-name{font-family:'Inter',sans-serif;font-weight:500;font-size:15px;letter-spacing:0.1px;line-height:1.15;}
  .credit{
    font-size:10px;color:var(--text-muted);letter-spacing:.3px;margin-top:1px;
    /* Optical nudge: "YouVote 2.0" (15px medium) and "By YE Chew" (10px)
       are both flush-left at the same x, but the wide diagonal stroke of
       the capital Y reads as starting further left than the B below it.
       A small indent makes the B line up with roughly where the Y's
       stem/tail sits, instead of literal pixel-flush left edges.
       Adjust this value first if it still looks off — it's a visual
       call, not something verifiable from code alone. */
    margin-left:4px;
  }
  /* ---------- Poll-page footer credit (v14) ----------
     Replaces the old top-left icon+"YouVote 2.0"+"By YE Chew" brand row
     on the poll page (still present on Home — see renderHome). Centered
     (not bottom-left) so it never sits under the always-present undo/redo
     history-fab pair, which already occupies the bottom-left/right
     corners at bottom:18px. Non-interactive: it's a credit line, not a
     tappable link back Home (use the existing "⋯" menu / browser back for
     that). */
  .footer-credit{
    position:fixed;left:0;right:0;bottom:6px;z-index:12;
    text-align:center;color:var(--text-muted);font-size:10px;opacity:.5;
    pointer-events:none;
  }

  /* ---------- Home ---------- */
  .hero-compact{color:var(--text-muted);font-size:12.5px;line-height:1.4;margin:0 0 14px;}

  .install-banner-compact{
    display:flex;align-items:center;gap:8px;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:8px 8px 8px 12px;margin-bottom:12px;
  }
  .install-banner-icon{font-size:16px;flex-shrink:0;}
  .install-banner-text{flex:1;color:var(--text-muted);font-size:12px;line-height:1.3;}
  .install-banner-hint{font-size:11px;color:var(--text-muted);flex-shrink:0;max-width:110px;text-align:right;}
  .install-banner-btn{width:auto !important;padding:7px 14px !important;font-size:12.5px !important;flex-shrink:0;}
  .install-banner-hint-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-size:12px;font-weight:600;padding:7px 12px;border-radius:14px;flex-shrink:0;
  }
  .install-banner-hint-btn:active{background:var(--violet-dim);}
  .install-banner-dismiss{
    background:transparent;border:none;color:var(--text-muted);font-size:14px;
    padding:6px;flex-shrink:0;line-height:1;opacity:.6;
  }
  .install-banner-dismiss:active{opacity:1;}

  .card{
    background:var(--surface);border:1px solid var(--border);
    border-radius:var(--radius);padding:14px;margin-bottom:12px;
  }
  .field-label{font-size:12.5px;color:var(--violet);margin-bottom:6px;display:block;font-weight:700;}
  .field-label-sub{font-size:11px;color:var(--violet);font-weight:400;margin:0 0 8px;display:block;line-height:1.35;}
  .field{
    width:100%;background:var(--surface-2);border:1.5px solid var(--border);
    border-radius:var(--radius-sm);padding:12px 14px;color:var(--text);font-size:15px;
    margin-bottom:14px;outline:none;transition:border-color .15s,box-shadow .15s;
    box-shadow:inset 0 1px 3px rgba(0,0,0,0.25);
  }
  .field::placeholder{color:var(--text-muted);font-size:12.5px;}
  .field:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(165,148,245,0.25);}
  textarea.field{resize:vertical;min-height:60px;}

  .btn{
    border:none;border-radius:var(--radius-sm);padding:12px 18px;font-size:14.5px;font-weight:600;
    display:inline-flex;align-items:center;justify-content:center;gap:6px;transition:transform .1s,opacity .15s;
  }
  .btn:active{transform:scale(0.97);}
  .btn-primary{background:var(--violet);color:#fff;width:100%;}
  .btn-primary:disabled{opacity:0.5;}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
  .btn-sm{padding:8px 12px;font-size:13px;}
  .btn-xs{padding:6px 9px;font-size:11.5px;}

  /* compact action chips — smaller, secondary-feeling */
  .chip-row{display:flex;gap:7px;flex-wrap:wrap;position:relative;}
  .chip{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-size:12px;font-weight:600;padding:5px 10px;border-radius:16px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .chip:active{background:var(--violet-dim);}
  .chip-icon-only{padding:5px 9px;}

  .recent-list{display:flex;flex-direction:column;gap:8px;}
  .swipe-wrap{position:relative;border-radius:var(--radius-sm);overflow:hidden;}
  .swipe-delete{
    position:absolute;top:0;right:0;bottom:0;width:76px;border:none;
    background:var(--rose);color:#2a1010;font-size:19px;
    display:flex;align-items:center;justify-content:center;
  }
  .recent-item{
    position:relative;display:flex;align-items:center;justify-content:space-between;
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    padding:13px 15px;text-decoration:none;color:var(--text);
    touch-action:pan-y;will-change:transform;
    -webkit-user-drag:none;user-select:none;-webkit-touch-callout:none;
  }
  .recent-item-title{font-weight:600;font-size:14.5px;}
  .recent-item-meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
  .recent-item-new{background:var(--violet-tint);border:1.5px dashed var(--violet);}
  .recent-item-new .recent-item-title{color:var(--violet);}
  .chevron{color:var(--text-muted);}
  .swipe-hint{font-size:11px;color:var(--text-muted);text-align:center;margin:2px 0 4px;opacity:.75;}

  .recent-item-main{flex:1;min-width:0;overflow:hidden;}
  .recent-item-actions{display:flex;align-items:center;gap:0;flex-shrink:0;}
  .recent-star-btn,.recent-pin-btn{
    background:transparent;border:none;color:var(--text-muted);font-size:15px;
    width:30px;height:30px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    border-radius:8px;padding:0;opacity:.55;
  }
  .recent-star-btn.active{opacity:1;color:var(--gold);}
  .recent-pin-btn.active{opacity:1;color:var(--violet);}
  .recent-star-btn:active,.recent-pin-btn:active{background:var(--violet-dim);}

  .home-filter-row{display:flex;gap:8px;margin-bottom:8px;}
  .home-filter-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text-muted);
    font-size:12.5px;font-weight:600;padding:7px 14px;border-radius:20px;
  }
  .home-filter-btn.active{background:var(--violet-dim);border-color:var(--violet);color:var(--text);}
  .empty-starred-hint{font-size:12.5px;color:var(--text-muted);text-align:center;padding:20px 10px;}

  .section-label{
    font-size:11.5px;text-transform:uppercase;letter-spacing:1.2px;color:var(--text-muted);
    font-weight:700;margin:26px 0 10px;
  }

  /* ---------- Poll view ---------- */
  .poll-header{
    margin:0 -16px 12px;padding:0 16px 8px;
    background:linear-gradient(180deg,rgba(37,31,56,0.4) 0%,rgba(37,31,56,0) 100%);
  }
  .poll-title{font-size:21px;margin:0 0 4px;font-weight:500;letter-spacing:0.1px;}
  .poll-title-row{
    position:sticky;top:0;z-index:30;
    background:linear-gradient(180deg,var(--violet-tint) 0%,rgba(37,31,56,0.55) 65%,rgba(37,31,56,0) 100%);
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    margin:0 -16px 0;padding:12px 16px 4px;
  }
  .poll-title-row .poll-title{margin:0;flex:1;min-width:0;word-break:break-word;}
  .poll-title-row .chip-icon-only{flex-shrink:0;}
  .poll-subtitle{font-size:12.5px;color:var(--text-muted);margin:3px 0 0;white-space:pre-wrap;word-break:break-word;}
  .meta-toggle{
    background:transparent;border:none;padding:2px 0;margin:-2px 0;
    color:var(--text-muted);font-size:12px;font-family:inherit;font-weight:inherit;
    text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;text-decoration-color:var(--border);
  }
  .meta-toggle:active{color:var(--violet);text-decoration-color:var(--violet);}
  .icon-btn{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    font-size:13px;font-weight:600;padding:6px 10px;border-radius:20px;
    display:inline-flex;align-items:center;gap:5px;
  }
  .icon-btn:active{background:var(--violet-dim);}

  .menu-popover{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);
    margin-top:8px;overflow:hidden;
  }
  .menu-item{
    width:100%;text-align:left;background:transparent;border:none;color:var(--text);
    padding:9px 14px;font-size:12.5px;font-weight:400;border-bottom:1px solid var(--border);
  }
  .menu-item:last-child{border-bottom:none;}
  .menu-item:active{background:var(--surface-2);}
  .format-flyout{
    position:fixed;z-index:80;transform:translate(-50%,-100%);
    display:flex;gap:2px;padding:4px;border-radius:10px;
    background:var(--surface-2);border:1px solid var(--border);
    box-shadow:0 6px 18px rgba(0,0,0,.4);
  }
  .format-flyout[hidden]{display:none;}
  .format-flyout button{
    width:34px;height:34px;border-radius:7px;border:none;background:transparent;color:var(--text);
    font-size:14px;display:flex;align-items:center;justify-content:center;
  }
  .format-flyout button:active{background:var(--violet-dim);}
  .format-flyout .fmt-b{font-weight:800;}
  .format-flyout .fmt-i{font-style:italic;font-family:serif;}
  .format-flyout .fmt-s{text-decoration:line-through;}
  .menu-divider{height:1px;background:var(--border);margin:4px 0;}

  /* ---------- option cards ---------- */
  .option-card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    margin-bottom:10px;overflow:hidden;
  }
  .option-row{position:relative;cursor:pointer;}
  .option-row:focus-visible{outline:2px solid var(--violet);outline-offset:-2px;}
  .opt-progress-bg{position:absolute;left:0;top:0;bottom:0;opacity:0.55;transition:width .3s ease;}
  .opt-row-content{position:relative;display:flex;align-items:center;gap:9px;padding:12px 11px;z-index:1;}
  .opt-row-text{flex:1;min-width:0;}
  .opt-thumb{
    width:34px;height:34px;border-radius:9px;overflow:hidden;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;background:var(--violet-dim);font-size:16px;
  }
  .opt-thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .opt-title{
    font-weight:600;font-size:14.5px;line-height:1.25;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  }
  .opt-count{font-size:12.5px;color:var(--text-muted);flex-shrink:0;}
  .opt-chevron{
    flex-shrink:0;color:var(--text-muted);font-size:11px;opacity:.55;
    transition:transform .15s,background .15s,opacity .15s;
    width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;
    background:transparent;border:none;padding:0;margin:-5px -6px -5px -2px;
  }
  .opt-chevron:active{background:var(--violet-dim);opacity:1;}
  .opt-chevron.open{transform:rotate(180deg);opacity:.9;}
  .vote-btn{
    min-width:38px;height:24px;border-radius:7px;border:1.5px solid var(--border);
    background:var(--bg);color:var(--text-muted);
    flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:2px;
    font-size:9px;font-weight:800;letter-spacing:.1px;text-transform:uppercase;padding:0 5px;
    transition:background .15s,border-color .15s,color .15s;
  }
  .vote-btn.checked{background:var(--green);border-color:var(--green);color:#0d1a10;}
  .select-check{
    min-width:30px;width:30px;height:30px;border-radius:9px;border:1.5px solid var(--border);
    background:var(--bg);color:#0d1a10;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;transition:background .15s,border-color .15s;
  }
  .select-check.checked{background:var(--violet);border-color:var(--violet);color:#fff;}
  .bulk-bar{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    background:var(--violet-tint);border:1.5px solid var(--violet);border-radius:var(--radius-sm);
    padding:9px 10px 9px 12px;margin-bottom:10px;font-size:13px;color:var(--text);
  }
  .bulk-bar-left{display:flex;align-items:center;gap:8px;min-width:0;flex-shrink:1;}
  .bulk-select-all-btn{
    background:transparent;border:none;color:var(--violet);font-size:12px;font-weight:700;
    padding:2px 0;flex-shrink:0;text-decoration:underline;text-decoration-style:dotted;text-underline-offset:2px;
  }
  .bulk-select-all-btn:active{color:var(--text);}
  .bulk-count{font-size:12px;color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .bulk-bar-actions{display:flex;gap:6px;flex-shrink:0;}
  .option-detail{padding:0 14px 14px;border-top:1px solid var(--border);}
  .option-notes{font-size:13px;color:var(--text-muted);line-height:1.4;padding-top:10px;}
  .option-sub{margin-top:8px;}
  .link-chip{
    color:var(--violet);text-decoration:none;font-weight:600;
    background:rgba(140,122,230,0.12);border:1px solid var(--violet-dim);
    padding:3px 9px;border-radius:20px 0 0 20px;border-right:none;font-size:11.5px;
    max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .link-row-item{display:inline-flex;align-items:stretch;}
  .link-copy-btn{
    color:var(--text-muted);background:rgba(140,122,230,0.12);border:1px solid var(--violet-dim);
    border-radius:0 20px 20px 0;padding:3px 8px;font-size:11px;line-height:1;
  }
  .link-copy-btn:active{background:var(--violet-dim);color:var(--text);}
  .option-bottom{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px;}
  .voter-tokens{display:flex;flex-wrap:wrap;gap:5px;flex:1;align-items:center;}
  .voter-token{
    height:23px;padding:0 9px;border-radius:20px;background:var(--violet-dim);border:1px solid var(--violet);
    color:var(--text);font-size:11px;font-weight:600;display:flex;align-items:center;justify-content:center;
    max-width:120px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  }
  .vote-count-label{font-size:11.5px;color:var(--text-muted);}

  /* swipe-to-delete for poll option rows — same mechanics as home list */
  .swipe-wrap-option{position:relative;border-radius:var(--radius);overflow:hidden;margin-bottom:10px;background:var(--rose);}
  .swipe-wrap-option .option-card{margin-bottom:0;touch-action:pan-y;will-change:transform;}
  .swipe-delete-option{
    position:absolute;top:0;right:0;bottom:0;width:76px;border:none;
    background:var(--rose);color:#2a1010;font-size:19px;
    display:flex;align-items:center;justify-content:center;
    transition:font-size .15s ease;
  }
  .swipe-wrap-option.swipe-armed .swipe-delete-option{font-size:26px;}
  .swipe-wrap-option.swipe-armed .option-card{filter:brightness(0.92);}

  /* ---------- collapsible "add option" control ---------- */
  .add-row{display:flex;gap:8px;margin-bottom:8px;}
  .add-toggle-btn{
    flex:1;background:var(--violet-tint);border:1.5px dashed var(--violet);color:var(--violet);
    border-radius:var(--radius);padding:8px;font-size:12px;font-weight:700;
    display:flex;align-items:center;justify-content:center;gap:5px;margin-bottom:0;
  }
  .add-toggle-btn:active{background:var(--violet-dim);}
  .add-option-card{background:var(--violet-tint);border:1.5px solid var(--violet);}
  .add-option-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .add-option-head h3{margin:0;font-size:14px;font-family:'Inter',sans-serif;font-weight:700;color:var(--violet);}
  .add-collapse-btn{background:transparent;border:none;color:var(--text-muted);font-size:12.5px;font-weight:600;padding:4px;}

const $toast = document.getElementById('toast');

  <div class="boot-brand">

/* ---------- "Install app" support ----------
   Chrome shows its own automatic install banner, but Brave (and several
   other Chromium browsers) don't proactively surface it — the user has to
   trigger it themselves. Capturing the event ourselves lets us show a
   direct, reliable "Install" button on the home screen instead of relying
   on each browser's own hidden menu wording. iOS Safari never fires this
   event at all (Apple has no equivalent API), so it gets its own
   instructions instead of a button. */
let deferredInstallPrompt = null;
let homeFilter = 'all'; // 'all' | 'starred' — persists across re-renders of the home screen
function isStandaloneMode(){
  return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
}
function isIOS(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
// WhatsApp/Instagram/Facebook/Line/WeChat all open shared links in their
// own embedded in-app browser rather than the person's real browser or
// native apps — so a tap on an Instagram/Maps option link stays trapped
// in that same sandboxed webview instead of opening the Instagram app or
// a full browser. There's no way for a page to force its way out of that
// sandbox (deliberate platform restriction, most pronounced on iOS) — the
// most a site can do is detect it and prompt the person to escape once,
// after which normal links behave normally again.
function detectInAppBrowser(){
  const ua = navigator.userAgent || '';
  if (/FBAN|FBAV|FB_IAB/i.test(ua)) return 'Facebook';
  if (/Instagram/i.test(ua)) return 'Instagram';
  if (/\bLine\//i.test(ua)) return 'Line';
  if (/MicroMessenger/i.test(ua)) return 'WeChat';
  if (/WhatsApp/i.test(ua)) return 'WhatsApp'; // rare to see on the UA itself, but covers cases where it is
  return null;
}

// it forever — most people don't install on day one, so a permanent hide
// would bury a genuinely useful prompt. Re-surfaces automatically after.
const INSTALL_BANNER_SNOOZE_MS = 14 * 24 * 60 * 60 * 1000;
function isInstallBannerSnoozed(){
  const dismissedAt = Number(localStorage.getItem('installBannerDismissedAt') || 0);
  return dismissedAt && (Date.now() - dismissedAt) < INSTALL_BANNER_SNOOZE_MS;
}
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();

  if (document.getElementById('new-title')) renderHome();
});
window.addEventListener('appinstalled', () => {

function toast(msg){

/* ---------- unified back-button-closable overlay stack ----------
   Every transient overlay — a modal, the "..." menu, the add-option
   panel, an expanded option's dropdown, bulk-select mode — pushes ONE
   history entry when it opens, with a matching close callback stored
   here. Hardware/browser back then closes only the most recently opened
   overlay (LIFO), the same way Instagram's comment sheet closes over the
   video instead of exiting the app — instead of the old behavior where
   only actual modals had this and everything else (menu, dropdowns,
   add-option) fell straight through to the home screen.

   Programmatic closes (Cancel/X button, tapping outside, choosing a menu
   item, re-tapping the same toggle) go through closeOverlay(), which does
   the visual close immediately and THEN consumes the matching history
   entry — never the reverse. Close functions must be idempotent (safe to
   call twice) since the same function may also run from the popstate
   handler below if the back button fires around the same time.

   swapOverlay() replaces what the CURRENT top-of-stack entry closes,
   WITHOUT changing history depth — used when one overlay hands off to
   another at the same nesting level (e.g. the "..." menu opening
   bulk-select mode, or one modal swapping for a confirmation). This
   avoids pairing an explicit history.back() with an immediate pushState,
   which would race the delayed popstate against whatever opens next. */
const overlayStack = [];
function pushOverlay(closeFn){
  overlayStack.push(closeFn);
  history.pushState({ overlay: true }, '');
}
function closeOverlay(closeFn){
  closeFn();
  const idx = overlayStack.lastIndexOf(closeFn);
  if (idx !== -1) overlayStack.splice(idx, 1);
  if (history.state && history.state.overlay) history.back();
}
function swapOverlay(newCloseFn){
  if (overlayStack.length) overlayStack[overlayStack.length - 1] = newCloseFn;
  else pushOverlay(newCloseFn);
}
window.addEventListener('popstate', () => {
  if (!overlayStack.length) return;
  const closeFn = overlayStack.pop();
  closeFn();
});

/* ---------- modal helpers (built on the overlay stack above) ---------- */
function openModal(backdrop, opts){
  document.body.appendChild(backdrop);
  const closeFn = () => backdrop.remove();
  backdrop._overlayClose = closeFn;
  if (opts && opts.swap) swapOverlay(closeFn); else pushOverlay(closeFn);
  const modal = backdrop.querySelector('.modal');
  if (modal && !modal.querySelector('.modal-close')) {
    const x = document.createElement('button');
    x.className = 'modal-close';
    x.setAttribute('aria-label', 'Close');
    x.textContent = '✕';
    x.addEventListener('click', () => closeModal(backdrop));
    modal.prepend(x);
  }

function closeModal(backdrop){
  if (!backdrop.isConnected) return;
  hideFormatFlyout(); // the field it was pointing at is about to be removed
  closeOverlay(backdrop._overlayClose || (() => backdrop.remove()));
}
/* Swap one modal for another as a single step in a flow (e.g. picking an

function swapModal(oldBackdrop, newBackdrop){
  oldBackdrop.remove();
  document.body.appendChild(newBackdrop);
  const closeFn = () => newBackdrop.remove();
  newBackdrop._overlayClose = closeFn;
  swapOverlay(closeFn);
  const modal = newBackdrop.querySelector('.modal');
  if (modal && !modal.querySelector('.modal-close')) {
    const x = document.createElement('button');
    x.className = 'modal-close';
    x.setAttribute('aria-label', 'Close');
    x.textContent = '✕';
    x.addEventListener('click', () => closeModal(newBackdrop));

}


/* Extracts every URL from a pasted text blob, along with whatever nearby
   caption text sits next to it — e.g. a friend's WhatsApp message reading
   "try this place 🔥 [link]" or a caption on the line above/below a
   link-only message. This context is the only real signal we have for
   naming links that carry nothing useful in the URL itself (Instagram,
   XHS/TikTok share links are just opaque IDs) — without it, AI naming
   has nothing more to work with than the URL parsing already does. */
function extractLinksWithContext(text){
  const urlRe = /https?:\/\/[^\s]+/gi;
  const lines = (text || '').split('\n');
  const contextByUrl = {};
  const urls = [];
  lines.forEach((line, i) => {
    const found = line.match(urlRe) || [];
    if (!found.length) return;
    found.forEach(raw => {
      const url = raw.replace(/[)\]>,.!?"']+$/, '');
      if (!urls.includes(url)) urls.push(url);
      let caption = line.replace(urlRe, '').trim();
      if (!caption) {
        // URL-only line — the caption is probably the line right before or after it.
        caption = (lines[i - 1] || '').trim() || (lines[i + 1] || '').replace(urlRe, '').trim();
      }
      if (caption) {
        contextByUrl[url] = ((contextByUrl[url] || '') + ' ' + caption).trim().slice(0, 150);
      }
    });
  });
  return { urls, contextByUrl };
}

function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
/* ---------- lightweight rich text: bold / italic / strikethrough ----------
   Storage format is plain markdown-style markers (**bold**, *italic*,
   ~~strikethrough~~) saved straight into the title/subtitle/option-name
   string fields — no new schema, no separate "formatted" field to keep in
   sync. escapeHtml() runs FIRST, then the marker regexes run on the
   already-escaped string — safe because none of &<>"' overlap with *~,
   so escaping can never create or destroy a marker, and the regexes can
   never introduce unescaped user text into the DOM. Always use this
   instead of a bare escapeHtml() everywhere a title/subtitle/option name
   is displayed as text (not inside an <input value="">, which needs the
   raw markers so they're editable). */
function renderFormattedText(s){
  let out = escapeHtml(s);
  out = out.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/~~([^\n]+?)~~/g, '<del>$1</del>');
  out = out.replace(/(^|[^*])\*([^\n*]+?)\*(?!\*)/g, '$1<em>$2</em>');
  return out;
}
/* ---------- selection-triggered formatting flyout ----------
   One static flyout element (see <body>, right after the undo banner) is
   shared across every eligible field on every screen — attachFormatToolbar()
   just points it at whichever input currently has a selection, rather than
   each draw() creating its own copy. Necessary because $app.innerHTML gets
   fully replaced on every draw(), which would otherwise wipe out and
   re-create the flyout (and its listeners) constantly; keeping it outside
   #app means it survives every re-render undisturbed. */
let formatFlyoutTarget = null;
function hideFormatFlyout(){
  const el = document.getElementById('format-flyout');
  if (el) el.hidden = true;
  formatFlyoutTarget = null;
}
function attachFormatToolbar(inputEl){
  if (!inputEl) return;
  const flyout = document.getElementById('format-flyout');
  if (!flyout) return;
  const maybeShow = () => {
    if (inputEl.selectionStart == null || inputEl.selectionStart === inputEl.selectionEnd) {
      if (formatFlyoutTarget === inputEl) hideFormatFlyout();
      return;
    }
    const r = inputEl.getBoundingClientRect();
    flyout.style.left = `${Math.min(Math.max(r.left + r.width / 2, 60), window.innerWidth - 60)}px`;
    flyout.style.top = `${Math.max(r.top - 8, 48)}px`;
    flyout.hidden = false;
    formatFlyoutTarget = inputEl;
  };
  inputEl.addEventListener('select', maybeShow);
  inputEl.addEventListener('mouseup', maybeShow);
  inputEl.addEventListener('touchend', () => setTimeout(maybeShow, 0));
  inputEl.addEventListener('keyup', maybeShow);
  // Delayed so a tap ON the flyout's own buttons (which fires blur first)
  // isn't lost before the button's click handler gets to read the selection.
  inputEl.addEventListener('blur', () => setTimeout(() => { if (formatFlyoutTarget === inputEl) hideFormatFlyout(); }, 180));
}
(function initFormatFlyoutButtons(){
  const flyout = document.getElementById('format-flyout');
  if (!flyout) return;
  flyout.querySelectorAll('[data-format]').forEach(btn => {
    // Keeps focus/selection on the input instead of letting the tap steal it.
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });
    btn.addEventListener('click', () => {
      const el = formatFlyoutTarget;
      if (!el) return;
      const marker = btn.getAttribute('data-format');
      const start = el.selectionStart, end = el.selectionEnd;
      if (start == null || start === end) return;
      const val = el.value;
      const selected = val.slice(start, end);
      const alreadyWrapped = selected.length >= marker.length * 2 && selected.startsWith(marker) && selected.endsWith(marker);
      const nextSelected = alreadyWrapped ? selected.slice(marker.length, selected.length - marker.length) : `${marker}${selected}${marker}`;
      el.value = val.slice(0, start) + nextSelected + val.slice(end);
      el.focus();
      el.setSelectionRange(start, start + nextSelected.length);
      el.dispatchEvent(new Event('input', { bubbles: true }));
      hideFormatFlyout();
    });
  });
  document.addEventListener('scroll', hideFormatFlyout, true);
})();
function initialsOf(name){
  // Spreading a string (rather than indexing with [0]) iterates by Unicode
  // code point, so multi-byte characters — emoji included — come out whole
  // instead of getting sliced into a broken half-surrogate that renders as "?".
  const words = name.trim().split(/\s+/).filter(Boolean);
  return words.slice(0, 3).map(w => [...w][0] || '').join('').toUpperCase();
}
function shortNameOf(name){
  // First word only — plays nicer with one-word nicknames than initials do,
  // and keeps voter chips compact when many people have voted.
  return (name || '').trim().split(/\s+/)[0] || name || '';
}
function genId(len=7){
  return Array.from(crypto.getRandomValues(new Uint8Array(len)))
    .map(b => (b % 36).toString(36)).join('');
}
/* ---------- title-based poll id, so the share link reads like the poll ----------
   e.g. "Weekend hike?" -> weekend-hike-a8f3k. Keeps the link readable in
   WhatsApp previews without needing a custom domain/subdomain per poll. */
function slugify(s){
  return (s || '')
    .normalize('NFKD').replace(/[\u0300-\u036f]/g, '')
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40);
}
function genPollId(title){
  const slug = slugify(title);
  return slug ? `${slug}-${genId(5)}` : genId(8);
}

/* ---------- incoming share (Android "Share to YouVote") ----------
   Pulls every URL out of whatever the share sheet handed us — apps like
   WhatsApp usually put links in "text" rather than a dedicated "url"
   field, sometimes with extra words around them, so we scan all three
   fields. Forwarding several WhatsApp messages at once lands here as one
   block of text with multiple links in it, so this grabs ALL of them
   (deduped, in the order they appeared) rather than just the first. */
function extractSharedLinks(sharedUrl, sharedText, sharedTitle){
  const urlRe = /https?:\/\/[^\s]+/gi;
  const combined = [sharedUrl, sharedText, sharedTitle].filter(Boolean).join('\n');
  const matches = combined.match(urlRe) || [];
  const cleaned = matches.map(u => u.replace(/[)\]>,.!?"']+$/, '')); // trim trailing punctuation
  return Array.from(new Set(cleaned)); // dedupe, keep first-seen order
}

/* ---------- shared link → option, resolving a name (and photo, where
   available) via the resolve-link API, falling back to a friendly
   platform label if resolution fails so nothing is ever left blank.
   When the result is still just a generic platform label (nothing real
   could be scraped — true for Instagram/XHS/TikTok/Maps-without-a-name/
   Search-without-a-clear-query), a second, optional pass asks the
   server-side Gemini proxy (/api/generate-name) to turn that + any
   nearby chat caption into a real, readable name. This step is entirely
   best-effort: any failure (no key configured, rate limited, offline)
   just falls back to what resolve-link.js already found — it never
   blocks or breaks adding the option. ---------- */
async function resolveNameForLink(link, context){
  let base;
  try {
    const res = await fetch(`/api/resolve-link?url=${encodeURIComponent(link)}`);
    const data = await res.json();
    base = (res.ok && data.name)
      ? { name: data.name, url: data.resolvedUrl || link, thumbnail: data.image || null }
      : { name: linkPreviewLabel(link), url: link, thumbnail: null };
  } catch (e) {
    base = { name: linkPreviewLabel(link), url: link, thumbnail: null };
  }

  const stillGeneric = base.name === linkPreviewLabel(link);
  if (stillGeneric && (context || base.name)) {
    try {
      const res = await fetch('/api/generate-name', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ url: link, platformLabel: base.name, context: context || '' }),
      });
      const data = await res.json();
      if (res.ok && data.name && data.name.trim()) {
        return { ...base, name: data.name.trim() };
      }
    } catch (e) { /* AI naming is best-effort — keep the base result below */ }
  }
  return base;
}

async function batchAddLinksAsOptions(pollId, links, contextByUrl, sectionId){
  const names = await Promise.all(links.map(async (link) => {
    const { name, url, thumbnail } = await resolveNameForLink(link, contextByUrl && contextByUrl[link]);
    const cleanUrl = sanitizeShareUrlClient(url); // safety net in case the server-side sanitize didn't stick
    const payload = {
      name, notes: '', link: cleanUrl, links: [cleanUrl], thumbnail: thumbnail || null,
      isDate: false, votes: {}, createdAt: serverTimestamp()
    };
    if (sectionId) payload.sectionId = sectionId;
    await addDoc(collection(db, 'polls', pollId, 'options'), payload);
    return name;
  }));
  return names;
}

/* ---------- generic swipe-to-delete (used by home list and poll options) ---------- */
function bindSwipeToDelete(wrapSelector, rowSelector, delBtnAttr, onDelete, onAutoDelete){
  const OPEN = -76;
  // Shared across every row in THIS group (home list, or poll options) so
  // only one row can ever sit in the revealed/open state at once. Without
  // this, swiping row A open then row B open left both visually revealed
  // with two live delete buttons — tapping the second one needed an extra
  // tap because pointer capture from the still-mid-gesture first row was
  // interfering. Auto-closing the previous row the moment a new drag
  // starts removes that whole class of bug instead of chasing the symptom.
  let openRow = null;
  function closeOpenRow(){
    if (!openRow) return;
    const { row } = openRow;
    row.style.transition = 'transform .18s ease';
    row.style.transform = 'translateX(0)';
    openRow = null;
  }
  document.querySelectorAll(wrapSelector).forEach(wrap => {
    const row = wrap.querySelector(rowSelector);
    const delBtn = wrap.querySelector(`[${delBtnAttr}]`);
    if (!row) return;
    let startX = 0, startTranslate = 0, current = 0, dragging = false, moved = false, suppressClick = false;
    let wrapWidth = 0, FAR = -9999, armed = false;

    row.addEventListener('pointerdown', (e) => {
      if (openRow && openRow.row !== row) closeOpenRow();
      startX = e.clientX;
      startTranslate = current;
      dragging = true;
      moved = false;
      armed = false;
      wrapWidth = wrap.getBoundingClientRect().width;
      // Far enough that it clearly reads as a deliberate "throw it away"
      // gesture, not an accidental deep drag — but short enough for a
      // comfortable one-thumb swipe, not a two-handed stretch across the
      // whole screen.
      FAR = onAutoDelete ? -Math.max(108, wrapWidth * 0.36) : -Infinity;
      row.style.transition = 'none';
      row.setPointerCapture?.(e.pointerId);
    });
    row.addEventListener('pointermove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - startX;
      if (Math.abs(dx) > 6) moved = true;
      const lowerBound = onAutoDelete ? -wrapWidth : OPEN;
      current = Math.max(lowerBound, Math.min(0, startTranslate + dx));
      row.style.transform = `translateX(${current}px)`;
      if (onAutoDelete) {
        const shouldArm = current <= FAR;
        if (shouldArm !== armed) {
          armed = shouldArm;
          wrap.classList.toggle('swipe-armed', armed);
          if (armed && navigator.vibrate) navigator.vibrate(12);
        }
      }
    });
    const finish = () => {
      if (!dragging) return;
      dragging = false;
      if (onAutoDelete && current <= FAR) {
        // Swiped far enough — commit to delete immediately, no confirm tap,
        // sliding the row the rest of the way off-screen first.
        row.style.transition = 'transform .16s ease, opacity .16s ease';
        row.style.transform = `translateX(${-wrapWidth}px)`;
        row.style.opacity = '0';
        suppressClick = true;
        wrap.dataset.justDragged = '1';
        if (openRow && openRow.row === row) openRow = null;
        setTimeout(() => onAutoDelete(delBtn), 140);
        return;
      }
      row.style.transition = 'transform .18s ease';
      wrap.classList.remove('swipe-armed');
      if (!moved) {
        // a tap, not a drag: if the row was already open, this tap should
        // just close it — never let the click that follows also navigate,
        // and never let a child's own click handler (e.g. expand-on-tap) fire.
        if (startTranslate === OPEN) {
          current = 0;
          row.style.transform = 'translateX(0)';
          suppressClick = true;
          wrap.dataset.justDragged = '1';
          openRow = null;
        }
        return;
      }
      current = current < OPEN / 2 ? OPEN : 0;
      row.style.transform = `translateX(${current}px)`;
      suppressClick = true; // a real drag should never also fire navigation
      wrap.dataset.justDragged = '1';
      openRow = current === OPEN ? { row, wrap } : null;
    };
    row.addEventListener('pointerup', finish);
    row.addEventListener('pointercancel', finish);
    // Capture phase, not bubble: a click on the inner .option-row (which
    // has its own vote-casting click handler) reaches that handler BEFORE
    // it would reach a bubble-phase listener here — so suppressing it here,
    // after the fact, was too late and the vote fired anyway. Intercepting
    // during capture (outside-in, parent before child) stops it in time.
    row.addEventListener('click', (e) => {
      if (suppressClick) {
        e.preventDefault();
        e.stopPropagation();
        e.stopImmediatePropagation();
        suppressClick = false;
      }
    }, true);

    delBtn?.addEventListener('click', () => {
      if (openRow && openRow.row === row) openRow = null;
      onDelete(delBtn);
    });
  });
}
