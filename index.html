function renderPollView(id, opts){
  $app.innerHTML = BOOT_SKELETON_HTML;
  // A single shared link still prefills the add-option form so it can be
  // reviewed before saving (unchanged from before). Several links at once
  // skip that per-item review and get resolved + added straight away, the
  // same way "pick dates" batch-adds — reviewing/renaming after the fact
  // via the ✏️ edit button is quicker than confirming each one up front.
  const incomingLinks = (opts && opts.prefillLinks) ? opts.prefillLinks : (opts && opts.prefillLink ? [opts.prefillLink] : []);
  const prefillLink = incomingLinks.length === 1 ? incomingLinks[0] : '';
  const pendingBatchLinks = incomingLinks.length > 1 ? incomingLinks : null;
  const pendingLinkContext = (opts && opts.linkContext) || {};

  const pollRef = doc(db, 'polls', id);
  const optionsRef = query(collection(db, 'polls', id, 'options'), orderBy('createdAt', 'asc'));

  let pollData = null;
  let options = [];
  let menuOpen = false;
  let addTab = 'text';
  let addExpanded = !!prefillLink;
  let namePrompted = false;
  let draftName = '';
  let draftLink = prefillLink;
  let draftThumbnail = null;
  let notesExpanded = false;
  let pendingAutoResolve = !!prefillLink;
  let pendingBatchAdd = !!pendingBatchLinks;
  const expandedIds = new Set();
  const expandCloseFns = new Map();
  let selectMode = false;
  const selectedIds = new Set();
  const calState = { month: new Date(new Date().getFullYear(), new Date().getMonth(), 1), selected: new Set() };
  // Which section tab is showing (null for a plain, non-sectioned poll).
  // Validated/defaulted to the first section every time fresh poll data
  // arrives — see the onSnapshot(pollRef) callback below — so a deleted
  // or not-yet-loaded section id can never leave this pointing nowhere.
  let activeSectionId = null;
  // Swipe-to-switch-section tracking for the section tab row specifically
  // (separate from the per-option swipe-to-delete below it, which uses its
  // own pointer-capture logic on each row — this only watches the tab strip).
  let tabTouchStartX = 0, tabTouchStartY = 0, tabTouchActive = false;
  // Long-press-then-drag reorder of the section pills — separate from the
  // quick-swipe-to-switch gesture above; a 350ms hold with barely any
  // movement is what tells them apart (see the touch handlers below).
  let tabDragTimer = null, tabDragging = false, tabDragEl = null, tabDragSuppressClick = false;
  // Whether hidden sections are currently revealed in the tab row. Not
  // persisted — resets to false every time this poll is opened fresh, so
  // hidden tabs stay out of the way by default.
  let showHiddenSections = false;

  /* ---------- back-button-closable state for this poll's overlays ---------- */
  function closeMenu(){
    if (!menuOpen) return;
    menuOpen = false;
    draw();
  }
  function closeAddPanel(){
    if (!addExpanded) return;
    addExpanded = false;
    draw();
  }
  function closeSelectMode(){
    if (!selectMode) return;
    selectMode = false;
    selectedIds.clear();
    draw();
  }
  // If the add-option panel starts open (arriving via a shared link),
  // register it as back-closable too, not just when opened by tapping
  // the toggle button.
  if (addExpanded) pushOverlay(closeAddPanel);

  /* ---------- local undo/redo (this device's own actions only) ----------
     Never touches anyone else's edits — it just remembers the inverse of
     whatever *this browser* just did (vote, add option, delete option,
     edit option) so a mis-tap is one button away from fixed. Resets
     whenever this poll is reopened, since it's a per-visit convenience,
     not a synced history. */
  const history = { undo: [], redo: [] };
  function pushHistory(entry){
    history.undo.push(entry);
    history.redo.length = 0;
    updateHistoryButtons();
  }
  async function performUndo(){
    const entry = history.undo.pop();
    if (!entry) return;
    updateHistoryButtons();
    try {
      await entry.undo();
      history.redo.push(entry);
      toast(`Undone: ${entry.label}`);
    } catch (e) {
      history.undo.push(entry);
      toast(`Could not undo: ${e.message || 'unknown error'}`);
      console.error(e);
    }
    updateHistoryButtons();
  }
  async function performRedo(){
    const entry = history.redo.pop();
    if (!entry) return;
    updateHistoryButtons();
    try {
      await entry.redo();
      history.undo.push(entry);
      toast(`Redone: ${entry.label}`);
    } catch (e) {
      history.redo.push(entry);
      toast(`Could not redo: ${e.message || 'unknown error'}`);
      console.error(e);
    }
    updateHistoryButtons();
  }
  function updateHistoryButtons(){
    const u = document.getElementById('poll-undo-fab');
    const r = document.getElementById('poll-redo-fab');
    if (u) {
      const top = history.undo[history.undo.length - 1];
      u.disabled = !top;
      u.title = top ? `Undo: ${top.label}` : 'Nothing to undo yet';
      u.setAttribute('aria-label', u.title);
      u.querySelector('.fab-badge')?.remove();
      if (history.undo.length > 1) {
        const badge = document.createElement('span');
        badge.className = 'fab-badge';
        badge.textContent = String(history.undo.length);
        u.appendChild(badge);
      }
    }
    if (r) {
      const top = history.redo[history.redo.length - 1];
      r.disabled = !top;
      r.title = top ? `Redo: ${top.label}` : 'Nothing to redo';
      r.setAttribute('aria-label', r.title);
      r.querySelector('.fab-badge')?.remove();
      if (history.redo.length > 1) {
        const badge = document.createElement('span');
        badge.className = 'fab-badge';
        badge.textContent = String(history.redo.length);
        r.appendChild(badge);
      }
    }
  }

  onSnapshot(pollRef, (snap) => {
    if (!snap.exists()) {
      $app.innerHTML = `<div class="empty-state">This poll doesn't exist or was removed.<br><br><a href="?" class="btn btn-ghost">Back home</a></div>`;
      return;
    }
    pollData = snap.data();
    addRecent(id, pollData.title);
    if (hasSections(pollData)) {
      const list = sectionListOf(pollData);
      // "Usable" means: still exists, AND either it's not hidden, or hidden
      // tabs are currently being shown. Otherwise fall back to the first
      // tab that's actually visible right now (never land on a tab with no
      // visible pill to represent it).
      const activeIsUsable = activeSectionId && list.some(s => s.id === activeSectionId && (showHiddenSections || !s.hidden));
      if (!activeIsUsable) {
        const fallback = list.find(s => showHiddenSections || !s.hidden) || list[0];
        activeSectionId = fallback ? fallback.id : null;
      }
    } else {
      activeSectionId = null;
    }
    draw();
    if (pendingAutoResolve) {
      pendingAutoResolve = false;
      resolveLink();
      toast('Added your shared link — check it below, then tap "Add to poll"');
    }
    if (pendingBatchAdd) {
      pendingBatchAdd = false;
      batchAddLinksAsOptions(id, pendingBatchLinks, pendingLinkContext, activeSectionId).then((names) => {
        toast(`Added ${names.length} link${names.length===1?'':'s'} — check names below, edit any that need fixing`);
      }).catch((e) => {
        toast(`Some links couldn't be added: ${e.message || 'unknown error'}`);
        console.error(e);
      });
    }
    // ask who's voting as soon as they land on a poll, not on their first tap
    if (!namePrompted && !getVoter()) {
      namePrompted = true;
      askVoterName(() => draw(), options);
    }
  }, (err) => {
    $app.innerHTML = `<div class="empty-state">Couldn't load poll — check your Firebase config in index.html.</div>`;
    console.error(err);
  });

  onSnapshot(optionsRef, (snap) => {
    options = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    draw();
  });

  function draw(){
    if (!pollData) return;
    hideFormatFlyout(); // full re-render is about to replace #app — any old target node is going away
    const voter = getVoter();
    const sectioned = hasSections(pollData);
    const sections = sectioned ? sectionListOf(pollData) : [];
    // A plain poll behaves exactly as before: sectionOptions === options.
    // A sectioned poll only ever shows/votes-on the active tab's options —
    // everything below (counts, empty state, the option list itself) reads
    // from sectionOptions, never the full cross-section list.
    const sectionOptions = sectioned ? options.filter(o => o.sectionId === activeSectionId) : options;
    const activeSection = sectioned ? sections.find(s => s.id === activeSectionId) : null;
    const activeMultiChoice = sectioned ? !!(activeSection && activeSection.multiChoice) : !!pollData.multiChoice;
    // options stay in creation order — never re-sorted by vote count, so
    // rows don't jump around as people vote. "Leading" is still highlighted.
    const topCount = sectionOptions.length ? Math.max(...sectionOptions.map(voteCount)) : 0;
    const totalVotes = sectionOptions.reduce((sum, o) => sum + voteCount(o), 0);
    // Whole-poll (not just this tab) — options added before the link-cleaning
    // logic existed can still be carrying the long, tracking-param-laden URL.
    const hasMessyLinks = options.some(o => optionLinks(o).some(l => l !== sanitizeShareUrlClient(l)));
    const allSelected = selectMode && sectionOptions.length > 0 && sectionOptions.every(o => selectedIds.has(o.id));

    $app.innerHTML = `
      <div class="poll-title-row">
        <h1 class="poll-title">${renderFormattedText(pollData.title)}</h1>
        <button class="chip chip-icon-only" id="more-menu-btn" title="More options" aria-label="More options">⋯</button>
      </div>
      <div class="poll-header">
        ${(() => {
          const iab = detectInAppBrowser();
          if (!iab || inAppBannerDismissed) return '';
          return `
            <div class="install-banner-compact" id="iab-banner">
              <span class="install-banner-icon">↗️</span>
              <span class="install-banner-text">Viewing inside ${iab} — links may not open properly here.</span>
              <button class="install-banner-hint-btn" id="iab-open-btn">Open in browser</button>
              <button class="install-banner-dismiss" id="iab-dismiss-btn" aria-label="Dismiss">✕</button>
            </div>
          `;
        })()}
        ${pollData.subtitle ? `<div class="poll-subtitle">${renderFormattedText(pollData.subtitle)}</div>` : ''}
        ${menuOpen ? `
          <div class="menu-popover" id="more-menu">
            <button class="menu-item" id="voter-identity-btn">👤 ${voter ? `${escapeHtml(voter.name)} — tap to rename` : 'Set your name'}</button>
            <div class="menu-divider"></div>
            <button class="menu-item" id="share-btn">🔗 Copy share link</button>
            <button class="menu-item" id="edit-title-btn">✏️ Edit poll title</button>
            <button class="menu-item" id="copy-results-btn">📋 Share results</button>
            <button class="menu-item" id="remind-btn">🔔 Remind everyone (WhatsApp)</button>
            ${sectioned
              ? `<button class="menu-item" id="rename-section-btn">✏️ Rename "${escapeHtml(activeSection ? activeSection.name : '')}"</button>`
              : `<button class="menu-item" id="add-first-section-btn">🏷️ Add a section</button>`
            }
            ${sectioned && sections.some(s => s.hidden)
              ? `<button class="menu-item" id="toggle-hidden-tabs-btn">${showHiddenSections ? '🙉 Hide hidden tabs' : `🙈 Show hidden tabs (${sections.filter(s => s.hidden).length})`}</button>`
              : ''
            }
            <div class="menu-divider"></div>
            <button class="menu-item" id="toggle-multi-btn">🔀 Toggle to ${activeMultiChoice ? 'single' : 'multiple'} choice</button>
            <button class="menu-item" id="bulk-select-btn">🗑️ Select options to delete</button>
            <button class="menu-item" id="merge-identity-btn">🙋 Claim votes from a previous name</button>
            ${hasMessyLinks ? `<button class="menu-item" id="clean-links-btn">🧹 Sanitize sharing links</button>` : ''}
            <div class="menu-divider"></div>
            <button class="menu-item" id="go-home-btn">🏠 Back to home</button>
          </div>
        ` : ''}
      </div>

      ${sectioned ? `
        <div class="section-tab-row" id="section-tab-row">
          ${sections.filter(s => showHiddenSections || !s.hidden).map(s => `<button type="button" class="section-tab-btn ${s.id === activeSectionId ? 'active' : ''} ${s.hidden ? 'is-hidden-tab' : ''}" data-section-tab="${s.id}">${s.hidden ? '🙈 ' : ''}${escapeHtml(s.name)}</button>`).join('')}
          ${sections.length < MAX_SECTIONS ? `<button type="button" class="section-tab-add" id="section-tab-add" aria-label="Add a section">＋</button>` : ''}
        </div>
      ` : ''}

      ${addExpanded
        ? addOptionCardHtml(addTab, calState, draftName, draftLink, notesExpanded)
        : `
          <div class="add-row">
            <button class="add-toggle-btn" id="add-toggle-btn">＋ ${sectioned && activeSection ? `Add to ${escapeHtml(activeSection.name)}` : 'Add an option'}</button>
          </div>
        `
      }

      ${sectionOptions.length === 0 ? `<div class="empty-state">${sectioned && activeSection ? `No options in "${escapeHtml(activeSection.name)}" yet — add the first one above.` : 'No options yet — add the first one above.'}</div>` : ''}

      ${selectMode ? `
        <div class="bulk-bar">
          <div class="bulk-bar-left">
            <button class="bulk-select-all-btn" id="bulk-select-all-btn">${allSelected ? 'Deselect all' : 'Select all'}</button>
            <span class="bulk-count">${selectedIds.size} selected</span>
          </div>
          <div class="bulk-bar-actions">
            <button class="btn btn-ghost btn-xs" id="bulk-cancel-btn">Cancel</button>
            <button class="btn btn-xs" id="bulk-delete-btn" style="background:var(--rose);color:#2a0f0f;" ${selectedIds.size ? '' : 'disabled'}>🗑️ Delete${selectedIds.size ? ` ${selectedIds.size}` : ''}</button>
          </div>
        </div>
      ` : (sectionOptions.length ? `<div class="swipe-hint">Swipe an option left to delete</div>` : '')}

      ${sectionOptions.map(opt => selectMode ? `
        ${optionCardHtml(opt, voter, totalVotes, voteCount(opt)===topCount && topCount>0, expandedIds.has(opt.id), true, selectedIds.has(opt.id))}
      ` : `
        <div class="swipe-wrap-option">
          <button class="swipe-delete-option" data-swipe-delete-option="${opt.id}" aria-label="Delete option">🗑️</button>
          ${optionCardHtml(opt, voter, totalVotes, voteCount(opt)===topCount && topCount>0, expandedIds.has(opt.id))}
        </div>
      `).join('')}

      <button class="history-fab history-fab-left" id="poll-undo-fab" title="Nothing to undo yet" aria-label="Undo" disabled>↺</button>
      <button class="history-fab history-fab-right" id="poll-redo-fab" title="Nothing to redo" aria-label="Redo" disabled>↻</button>
      <div class="footer-credit">YouVote 2.0 — By YE Chew</div>
    `;

    bindPollEvents(id, pollData, options, voter);
    updateHistoryButtons();
  }

  function bindPollEvents(pollId, pollData, options, voter){
    // Recomputed here (not passed in) so voting/add-option logic below always
    // scopes to whichever section tab is currently active — see draw()'s
    // matching computation, which this must stay consistent with.
    const sectioned = hasSections(pollData);
    const sections = sectioned ? sectionListOf(pollData) : [];
    // Matches exactly what the tab-row template actually renders (see
    // draw() above) — must stay in lockstep with that filter, since the
    // drag-reorder logic below reads pill order straight out of the DOM.
    const visibleSections = sections.filter(s => showHiddenSections || !s.hidden);
    const sectionOptions = sectioned ? options.filter(o => o.sectionId === activeSectionId) : options;
    const activeSection = sectioned ? sections.find(s => s.id === activeSectionId) : null;
    const activeMultiChoice = sectioned ? !!(activeSection && activeSection.multiChoice) : !!pollData.multiChoice;

    document.getElementById('poll-undo-fab')?.addEventListener('click', performUndo);
    document.getElementById('poll-redo-fab')?.addEventListener('click', performRedo);
    document.getElementById('voter-identity-btn')?.addEventListener('click', () => {
      menuOpen = false;
      draw();
      askVoterName(async (v) => {
        // Relabels this person's existing votes in this poll if they had
        // any under this id — a no-op for a first-time name (nothing to
        // relabel yet). Never creates a duplicate voter.
        const toUpdate = options.filter(o => o.votes && o.votes[v.id]);
        await Promise.all(toUpdate.map(o => updateDoc(doc(db, 'polls', pollId, 'options', o.id), {
          [`votes.${v.id}.name`]: v.name,
          [`votes.${v.id}.initials`]: v.initials
        })));
        draw();
      }, options);
    });

    document.getElementById('go-home-btn')?.addEventListener('click', () => {
      // A real navigation (not an SPA-style re-render) — matches how every
      // other poll<->home transition in this app works (see the
      // href="?poll=..." links on Home's recent-item cards), so there's no
      // need to separately tear down this poll's onSnapshot listeners.
      location.href = location.pathname;
    });

    document.getElementById('add-toggle-btn')?.addEventListener('click', () => {
      addExpanded = true;
      pushOverlay(closeAddPanel);
      draw();
    });
    document.getElementById('add-collapse-btn')?.addEventListener('click', () => {
      closeOverlay(closeAddPanel);
    });

    document.getElementById('iab-dismiss-btn')?.addEventListener('click', () => {
      inAppBannerDismissed = true;
      draw();
    });
    document.getElementById('iab-open-btn')?.addEventListener('click', () => {
      const url = location.href;
      if (isIOS()) {
        toast('Tap the ⋯ or ↗ icon at the top of this screen, then "Open in Safari"');
        return;
      }
      // No app package specified deliberately — lets Android offer whatever
      // the person's actual default/installed browsers are, rather than
      // assuming everyone uses Chrome.
      const intentUrl = `intent://${url.replace(/^https?:\/\//, '')}#Intent;scheme=https;action=android.intent.action.VIEW;end;`;
      window.location.href = intentUrl;
    });

    document.getElementById('share-btn')?.addEventListener('click', () => {
      navigator.clipboard?.writeText(location.href);
      toast('Link copied — send it to the group!');
      closeOverlay(closeMenu);
    });

    document.getElementById('remind-btn')?.addEventListener('click', () => {
      const voterCount = new Set(options.flatMap(o => Object.keys(o.votes || {}))).size;
      const socialProof = voterCount > 0
        ? `${voterCount} ${voterCount === 1 ? 'person has' : 'people have'} voted so far — don't miss out!`
        : `No one's voted yet — be the first!`;
      const message = `🗳️ Reminder to vote: "${pollData.title}"\n${socialProof}\n\n${location.href}`;
      // wa.me with no phone number opens WhatsApp's own chat picker, pre-filled —
      // works whether the recipient has YouVote or not, since it's just a WhatsApp message.
      window.open(`https://wa.me/?text=${encodeURIComponent(message)}`, '_blank');
      closeOverlay(closeMenu);
    });

    function openPasteLinksFlow(){
      openPasteLinksModal(async (links, contextByUrl) => {
        toast(`Adding ${links.length} link${links.length===1?'':'s'}…`);
        try {
          const names = await batchAddLinksAsOptions(pollId, links, contextByUrl, sectioned ? activeSectionId : undefined);
          toast(`Added ${names.length} option${names.length===1?'':'s'} — check names below`);
        } catch (e) {
          toast(`Could not add links: ${e.message || 'unknown error'}`);
          console.error(e);
        }
      });
    }

    document.querySelectorAll('[data-section-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        if (tabDragSuppressClick) { tabDragSuppressClick = false; return; } // this click is the tail end of a drag, not a tap
        const sid = btn.getAttribute('data-section-tab');
        if (sid === activeSectionId) return;
        activeSectionId = sid;
        draw();
      });
    });

    document.getElementById('section-tab-add')?.addEventListener('click', () => {
      openSectionModal(pollId, pollData, options, null, (newId) => { activeSectionId = newId; });
    });

    document.getElementById('add-first-section-btn')?.addEventListener('click', () => {
      menuOpen = false;
      draw();
      openSectionModal(pollId, pollData, options, null, (newId) => { activeSectionId = newId; }, { swap: true });
    });

    document.getElementById('rename-section-btn')?.addEventListener('click', () => {
      menuOpen = false;
      draw();
      if (activeSection) openSectionModal(pollId, pollData, options, activeSection, null, { swap: true });
    });

    document.getElementById('toggle-hidden-tabs-btn')?.addEventListener('click', () => {
      showHiddenSections = !showHiddenSections;
      closeOverlay(closeMenu);
    });

    /* ---------- section tab strip: quick swipe to switch, press-and-hold + drag to reorder, long-press-without-moving to hide/unhide ----------
       All three gestures share one touch listener set so they can never
       double-fire on the same touch. A hold under ~350ms with under ~8px
       of movement resolves as a tap (handled by the click listener above)
       or a swipe (handled on touchend below); holding past 350ms "picks
       up" that pill. From there, releasing after actually dragging it to
       a new spot reorders the tabs; releasing without having moved it at
       all is a plain long-press, which instead toggles that tab's hidden
       state (hide a visible tab, or un-hide one currently shown because
       "Show hidden tabs" is on). Deliberately scoped to just the tab row,
       never the whole page or the option list, so it can't fight the
       per-option swipe-to-delete gesture either. */
    const tabRow = document.getElementById('section-tab-row');
    if (tabRow && sections.length > 1) {
      tabRow.addEventListener('touchstart', (e) => {
        const t = e.touches[0];
        tabTouchStartX = t.clientX; tabTouchStartY = t.clientY; tabTouchActive = true;
        const pillEl = e.target.closest('.section-tab-btn');
        if (pillEl) {
          clearTimeout(tabDragTimer);
          tabDragTimer = setTimeout(() => {
            tabDragging = true;
            tabDragEl = pillEl;
            pillEl.classList.add('dragging');
          }, 350);
        }
      }, { passive: true });

      tabRow.addEventListener('touchmove', (e) => {
        if (!tabTouchActive) return;
        const t = e.touches[0];
        const dx = t.clientX - tabTouchStartX;
        const dy = t.clientY - tabTouchStartY;

        if (!tabDragging) {
          // moved too far to still be a "hold" — this is a swipe/scroll, cancel the pending pickup
          if (Math.abs(dx) > 8 || Math.abs(dy) > 8) clearTimeout(tabDragTimer);
          return;
        }

        e.preventDefault(); // now actively dragging — take over from the row's native horizontal scroll
        const pills = Array.from(tabRow.querySelectorAll('.section-tab-btn')).filter(el => el !== tabDragEl);
        let insertBefore = document.getElementById('section-tab-add') || null;
        for (const pill of pills) {
          const r = pill.getBoundingClientRect();
          if (t.clientX < r.left + r.width / 2) { insertBefore = pill; break; }
        }
        if (insertBefore !== tabDragEl.nextSibling) tabRow.insertBefore(tabDragEl, insertBefore);
      }, { passive: false });

      tabRow.addEventListener('touchend', (e) => {
        clearTimeout(tabDragTimer);
        if (!tabTouchActive) return;
        tabTouchActive = false;

        if (tabDragging) {
          tabDragging = false;
          const heldEl = tabDragEl;
          heldEl?.classList.remove('dragging');
          tabDragSuppressClick = true; // the click that follows this touch is drag fallout, not a real tap
          // Compare against visibleSections (what's actually in the DOM),
          // not the full sections list — a hidden tab that isn't shown
          // right now would throw the index-by-index comparison off.
          const newOrderIds = Array.from(tabRow.querySelectorAll('.section-tab-btn')).map(el => el.getAttribute('data-section-tab'));
          const unchanged = newOrderIds.every((sid, i) => visibleSections[i] && visibleSections[i].id === sid);
          tabDragEl = null;
          if (unchanged) {
            // Held it down but never actually dragged it anywhere — that's
            // a long-press, not a reorder. Toggle this tab's hidden state.
            const sid = heldEl?.getAttribute('data-section-tab');
            const s = sid && sections.find(x => x.id === sid);
            if (s) toggleSectionHidden(pollId, pollData, s);
            return;
          }
          const updates = {};
          newOrderIds.forEach((sid, i) => { updates[`sections.${sid}.order`] = i; });
          updateDoc(doc(db, 'polls', pollId), updates).catch(err => {
            toast(`Could not save the new order: ${err.message || 'unknown error'}`);
            console.error(err);
          });
          return;
        }

        const t = e.changedTouches[0];
        const dx = t.clientX - tabTouchStartX;
        const dy = t.clientY - tabTouchStartY;
        if (Math.abs(dx) < 40 || Math.abs(dx) < Math.abs(dy) * 1.5) return; // not a clear horizontal swipe
        const idx = sections.findIndex(s => s.id === activeSectionId);
        if (idx === -1) return;
        const nextIdx = dx < 0 ? idx + 1 : idx - 1; // swipe left → next section, right → previous
        if (nextIdx < 0 || nextIdx >= sections.length) return;
        activeSectionId = sections[nextIdx].id;
        draw();
      }, { passive: true });
    }

    document.getElementById('bulk-select-btn')?.addEventListener('click', () => {
      menuOpen = false;
      selectMode = true;
      selectedIds.clear();
      swapOverlay(closeSelectMode); // hands off the menu's history slot to select mode
      draw();
    });

    document.getElementById('clean-links-btn')?.addEventListener('click', async () => {
      menuOpen = false;
      draw();
      const dirty = options.filter(o => optionLinks(o).some(l => l !== sanitizeShareUrlClient(l)));
      if (!dirty.length) return;
      toast(`Sanitizing ${dirty.length} link${dirty.length===1?'':'s'}…`);
      try {
        await Promise.all(dirty.map(o => {
          const cleaned = optionLinks(o).map(sanitizeShareUrlClient);
          return updateDoc(doc(db, 'polls', pollId, 'options', o.id), {
            links: cleaned, link: cleaned[0] || null
          });
        }));
        toast(`Sanitized ${dirty.length} link${dirty.length===1?'':'s'} ✓`);
      } catch (e) {
        toast(`Couldn't clean up all the links: ${e.message || 'unknown error'}`);
        console.error(e);
      }
    });

    document.getElementById('bulk-cancel-btn')?.addEventListener('click', () => {
      closeOverlay(closeSelectMode);
    });

    document.getElementById('bulk-select-all-btn')?.addEventListener('click', () => {
      const allIds = sectionOptions.map(o => o.id);
      const allCurrentlySelected = allIds.length > 0 && allIds.every(id => selectedIds.has(id));
      if (allCurrentlySelected) selectedIds.clear();
      else allIds.forEach(id => selectedIds.add(id));
      draw();
    });

    document.getElementById('bulk-delete-btn')?.addEventListener('click', () => {
      if (!selectedIds.size) return;
      const chosen = options.filter(o => selectedIds.has(o.id));
      openBulkDeleteModal(pollId, chosen, () => {
        closeOverlay(closeSelectMode);
      });
    });

    document.getElementById('copy-results-btn')?.addEventListener('click', () => {
      closeOverlay(closeMenu);
      // Always the FULL options list here, never sectionOptions — results
      // export covers every section at once (one image per section), not
      // just whichever tab happens to be open right now.
      shareOrCopyResults(pollData, options);
    });

    document.getElementById('merge-identity-btn')?.addEventListener('click', () => {
      menuOpen = false;
      draw();
      // Hands off the menu's history slot to whatever opens next (the
      // voter-name prompt, or straight to the merge modal) instead of
      // closing + immediately pushing — see the swapOverlay comment above.
      // Always the full poll's options (every section), never just the
      // active tab: claiming a name applies across all sections at once,
      // per how this app's identity model works — one name per person for
      // the whole poll, not a different one per section.
      if (!voter) { askVoterName((v) => openMergeIdentityModal(pollId, options, pollData, v, { swap: true }), options); return; }
      openMergeIdentityModal(pollId, options, pollData, voter, { swap: true });
    });

    async function toggleMultiChoice(){
      try {
        if (sectioned && activeSection) {
          await updateDoc(doc(db, 'polls', pollId), { [`sections.${activeSection.id}.multiChoice`]: !activeMultiChoice });
        } else {
          await updateDoc(doc(db, 'polls', pollId), { multiChoice: !pollData.multiChoice });
        }
        toast(activeMultiChoice ? 'Switched to single choice' : 'Switched to multiple choice');
      } catch (e) {
        toast(`Could not switch voting mode: ${e.message || 'unknown error'}`);
        console.error(e);
      }
    }
    document.getElementById('toggle-multi-btn')?.addEventListener('click', () => {
      closeOverlay(closeMenu);
      toggleMultiChoice();
    });

    document.getElementById('edit-title-btn')?.addEventListener('click', () => {
      // Hand off the menu's overlay slot directly to the edit-title modal
      // (swap, not close+push) — closing first triggers an async
      // history.back() that can pop the just-opened modal a tick later,
      // which is why this used closeOverlay() before and the modal never
      // stayed open. Same pattern as rename-section-btn below.
      menuOpen = false;
      draw();
      openEditTitleModal(pollId, pollData.title, pollData.subtitle, { swap: true });
    });

    document.getElementById('more-menu-btn')?.addEventListener('click', () => {
      if (menuOpen) {
        closeOverlay(closeMenu);
      } else {
        menuOpen = true;
        pushOverlay(closeMenu);
        draw();
      }
    });

    // Tapping anywhere on an option row votes for it. Only the chevron
    // button (below, with its own stopPropagation) expands/collapses.
    document.querySelectorAll('[data-vote-row]').forEach(row => {
      const fireVote = () => {
        const wrap = row.closest('.swipe-wrap-option');
        if (wrap && wrap.dataset.justDragged === '1') { wrap.dataset.justDragged = ''; return; }
        const optId = row.getAttribute('data-vote-row');
        if (selectMode) {
          if (selectedIds.has(optId)) selectedIds.delete(optId); else selectedIds.add(optId);
          draw();
          return;
        }
        const v = getVoter();
        if (!v) { askVoterName(() => castVoteWithHistory(optId)); return; }
        castVoteWithHistory(optId);
      };
      row.addEventListener('click', fireVote);
      row.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); fireVote(); }
      });
    });

    async function castVoteWithHistory(optId){
      const voter = getVoter();
      const voterKey = voter.id;
      // Scoped to sectionOptions, not the full poll — so voting in "Food"
      // never touches or clears a vote already cast in "Dates". A plain,
      // non-sectioned poll has sectionOptions === options, so this is a
      // no-op change in behavior for those.
      const prevVotedIds = sectionOptions.filter(o => o.votes && o.votes[voterKey]).map(o => o.id);
      const wasVotedForThis = prevVotedIds.includes(optId);
      const target = sectionOptions.find(o => o.id === optId);

      await castVote(pollId, sectionOptions, optId, activeMultiChoice);

      const applyVoteState = async (votedIds) => {
        const voterObj = { name: voter.name, initials: voter.initials };
        await Promise.all(sectionOptions.map(o => {
          const shouldHave = votedIds.includes(o.id);
          const has = !!(o.votes && o.votes[voterKey]);
          if (shouldHave === has) return Promise.resolve();
          return updateDoc(doc(db, 'polls', pollId, 'options', o.id), {
            [`votes.${voterKey}`]: shouldHave ? voterObj : deleteField()
          });
        }));
      };
      const newVotedIds = activeMultiChoice
        ? (wasVotedForThis ? prevVotedIds.filter(id => id !== optId) : [...prevVotedIds, optId])
        : (wasVotedForThis ? [] : [optId]);

      pushHistory({
        label: `Vote: ${target ? target.name : 'option'}`,
        undo: () => applyVoteState(prevVotedIds),
        redo: () => applyVoteState(newVotedIds),
      });
    }

    document.querySelectorAll('[data-toggle-expand]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wrap = btn.closest('.swipe-wrap-option');
        if (wrap && wrap.dataset.justDragged === '1') { wrap.dataset.justDragged = ''; return; }
        const optId = btn.getAttribute('data-toggle-expand');
        if (expandedIds.has(optId)) {
          const closeFn = expandCloseFns.get(optId);
          if (closeFn) closeOverlay(closeFn); else { expandedIds.delete(optId); draw(); }
        } else {
          expandedIds.add(optId);
          const closeFn = () => { expandedIds.delete(optId); expandCloseFns.delete(optId); draw(); };
          expandCloseFns.set(optId, closeFn);
          pushOverlay(closeFn);
          draw();
        }
      });
    });

    document.querySelectorAll('[data-edit]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const optId = btn.getAttribute('data-edit');
        const opt = options.find(o => o.id === optId);
        openEditModal(pollId, opt);
      });
    });

    document.querySelectorAll('[data-voter-fullname]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        toast(btn.getAttribute('data-voter-fullname'));
      });
    });

    document.querySelectorAll('[data-copy-link]').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.preventDefault();
        e.stopPropagation();
        const url = btn.getAttribute('data-copy-link');
        try {
          await navigator.clipboard.writeText(url);
          toast('Link copied');
        } catch (err) {
          toast(`Could not copy link: ${err.message || 'clipboard unavailable'}`);
          console.error(err);
        }
      });
    });

    document.querySelectorAll('[data-delete-option]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const optId = btn.getAttribute('data-delete-option');
        const opt = options.find(o => o.id === optId);
        openDeleteOptionModal(pollId, opt);
      });
    });

    bindSwipeToDelete('.swipe-wrap-option', '.option-card', 'data-swipe-delete-option', (delBtn) => {
      const optId = delBtn.getAttribute('data-swipe-delete-option');
      const opt = options.find(o => o.id === optId);
      if (opt) openDeleteOptionModal(pollId, opt);
    }, (delBtn) => {
      const optId = delBtn.getAttribute('data-swipe-delete-option');
      const opt = options.find(o => o.id === optId);
      if (opt) deleteOptionDirect(pollId, opt);
    });

    document.querySelectorAll('[data-add-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.getAttribute('data-add-tab');
        // "links" isn't a real drawer state — it hands off to the existing
        // bulk paste-and-extract modal, then leaves addTab exactly as it
        // was so the drawer doesn't visually jump to a "links" tab that
        // has no matching form.
        if (tab === 'links') { openPasteLinksFlow(); return; }
        addTab = tab;
        draw();
      });
    });

    if (addTab === 'text') {
      document.getElementById('add-option-btn')?.addEventListener('click', () => addOption(pollId));
      const nameInput = document.getElementById('opt-name');
      const linkInput = document.getElementById('opt-link');
      attachFormatToolbar(nameInput);
      nameInput?.addEventListener('input', () => { draftName = nameInput.value; });
      linkInput?.addEventListener('input', () => { draftLink = linkInput.value; });
      document.getElementById('notes-toggle-btn')?.addEventListener('click', () => {
        notesExpanded = !notesExpanded;
        const btn = document.getElementById('notes-toggle-btn');
        const wrap = document.getElementById('notes-wrap');
        btn.classList.toggle('expanded', notesExpanded);
        btn.setAttribute('aria-expanded', notesExpanded ? 'true' : 'false');
        wrap.classList.toggle('expanded', notesExpanded);
        if (notesExpanded) document.getElementById('opt-notes')?.focus();
      });
      document.querySelectorAll('.field-x[data-clear]').forEach(btn => {
        btn.addEventListener('click', () => {
          const target = document.getElementById(btn.getAttribute('data-clear'));
          if (!target) return;
          target.value = '';
          if (target.id === 'opt-name') draftName = '';
          target.focus();
        });
      });
      document.getElementById('ai-suggest-btn')?.addEventListener('click', async () => {
        const btn = document.getElementById('ai-suggest-btn');
        const resultsEl = document.getElementById('ai-suggest-results');
        btn.disabled = true; btn.textContent = '✨ Thinking…';
        try {
          const r = await fetch('/api/suggest-options', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
              pollTitle: pollData.title,
              pollSubtitle: pollData.subtitle,
              // Which tab you're adding to (e.g. "Food" vs "Dates") is the
              // strongest signal for what a suggestion should actually be —
              // without it, suggestions only reflect the overall poll title.
              sectionName: sectioned && activeSection ? activeSection.name : null,
              // Folding each option's notes in alongside its name (not just
              // the bare name) gives the AI real style/context to match —
              // e.g. "Zus Coffee (good for groups, has parking)" steers
              // suggestions toward similarly group-friendly spots, not just
              // "another coffee place".
              existingNames: options.map(o => o.notes ? `${o.name} (${o.notes})` : o.name),
            }),
          });
          // Read as text first, not r.json() directly — a crashed/misrouted
          // function can return an HTML error page instead of JSON, and
          // r.json() throwing would silently swallow the real reason. This
          // way the toast always shows something diagnosable instead of a
          // generic "no suggestions" message that could mean anything.
          const rawText = await r.text().catch(() => '');
          let data = {};
          try { data = rawText ? JSON.parse(rawText) : {}; } catch { data = {}; }
          if (!r.ok || !data.suggestions || !data.suggestions.length) {
            const fallback = rawText
              ? `Server error (${r.status}): ${rawText.slice(0, 150)}`
              : `Server returned an empty response (status ${r.status}) — check Vercel function logs`;
            toast(data.error || fallback);
            return;
          }
          resultsEl.innerHTML = data.suggestions.map(s =>
            `<button type="button" class="ai-suggest-chip" data-ai-suggest="${escapeHtml(s)}">${escapeHtml(s)}</button>`
          ).join('');
          // Hide button lives in the same row as "Suggest options" itself
          // (not above the chips) so it doesn't push the chips down or add
          // an extra line of vertical space.
          if (!document.getElementById('ai-suggest-close')) {
            btn.insertAdjacentHTML('afterend', `<button type="button" id="ai-suggest-close" class="ai-suggest-close">✕ Hide</button>`);
            document.getElementById('ai-suggest-close')?.addEventListener('click', (ev) => {
              ev.target.remove();
              resultsEl.innerHTML = '';
            });
          }
          resultsEl.querySelectorAll('[data-ai-suggest]').forEach(chip => {
            chip.addEventListener('click', () => {
              const name = chip.getAttribute('data-ai-suggest');
              draftName = name;
              if (nameInput) nameInput.value = name;
              nameInput?.focus();
              resultsEl.innerHTML = ''; // picking one clears the rest — no leftover clutter
              document.getElementById('ai-suggest-close')?.remove();
            });
          });
        } catch (e) {
          toast('Could not get suggestions — check your connection');
          console.error(e);
        } finally {
          btn.disabled = false; btn.textContent = '✨Suggest';
        }
      });
      document.getElementById('resolve-btn')?.addEventListener('click', () => pasteAndResolve());
      document.getElementById('clear-link-btn')?.addEventListener('click', () => {
        linkInput.value = '';
        draftLink = '';
        linkInput.focus();
        document.getElementById('resolve-status').textContent = '';
        draftThumbnail = null;
      });
      linkInput?.addEventListener('paste', () => setTimeout(resolveLink, 50));
      document.getElementById('add-link-btn')?.addEventListener('click', () => {
        const wrap = document.getElementById('extra-links-wrap');
        const row = document.createElement('div');
        row.className = 'extra-link-row';
        const input = document.createElement('input');
        input.className = 'field extra-link-input';
        input.placeholder = `Another link (optional)`;
        const removeBtn = document.createElement('button');
        removeBtn.type = 'button';
        removeBtn.className = 'link-clear-btn';
        removeBtn.setAttribute('aria-label', 'Remove this link');
        removeBtn.textContent = '✕';
        removeBtn.addEventListener('click', () => row.remove());
        row.appendChild(input);
        row.appendChild(removeBtn);
        wrap.appendChild(row);
        input.focus();
      });
    } else {
      document.getElementById('cal-prev')?.addEventListener('click', () => {
        calState.month = new Date(calState.month.getFullYear(), calState.month.getMonth() - 1, 1);
        draw();
      });
      document.getElementById('cal-next')?.addEventListener('click', () => {
        calState.month = new Date(calState.month.getFullYear(), calState.month.getMonth() + 1, 1);
        draw();
      });
      document.querySelectorAll('[data-cal-day]').forEach(btn => {
        btn.addEventListener('click', () => {
          const iso = btn.getAttribute('data-cal-day');
          if (calState.selected.has(iso)) calState.selected.delete(iso); else calState.selected.add(iso);
          draw();
        });
      });
      document.getElementById('add-dates-btn')?.addEventListener('click', () => addDateOptions(pollId, calState, () => draw()));
    }
  }

  async function resolveLink(){
    const link = document.getElementById('opt-link').value.trim();
    const statusEl = document.getElementById('resolve-status');
    if (!link) { statusEl.textContent = 'Paste a link first.'; return; }
    statusEl.textContent = 'Reading link…';
    try {
      const res = await fetch(`/api/resolve-link?url=${encodeURIComponent(link)}`);
      const data = await res.json();
      if (!res.ok || !data.name) {
        statusEl.textContent = data.error || 'Could not find a name in that link. Type it in above.';
        draftThumbnail = null;
        return;
      }
      document.getElementById('opt-name').value = data.name;
      draftName = data.name;
      if (data.resolvedUrl) { document.getElementById('opt-link').value = data.resolvedUrl; draftLink = data.resolvedUrl; }
      draftThumbnail = data.image || null;
      statusEl.textContent = `Found: ${data.name}`;
    } catch (e) {
      statusEl.textContent = `Couldn't read that link (${e.message || 'network error'}) — type the name in below.`;
      console.error(e);
    }
  }

  async function pasteAndResolve(){
    const input = document.getElementById('opt-link');
    const statusEl = document.getElementById('resolve-status');
    try {
      const clip = await navigator.clipboard.readText();
      if (clip && clip.trim()) {
        input.value = clip.trim();
        draftLink = clip.trim();
      } else if (!input.value.trim()) {
        statusEl.textContent = 'Clipboard is empty — copy the link first, then tap this.';
        return;
      }
    } catch (e) {
      if (!input.value.trim()) {
        statusEl.textContent = "Couldn't read clipboard — paste the link into the field above, then tap this.";
        input.focus();
        return;
      }
    }
    resolveLink();
  }

  async function addOption(pollId){
    const name = document.getElementById('opt-name').value.trim();
    const link = document.getElementById('opt-link').value.trim();
    const extraLinks = Array.from(document.querySelectorAll('.extra-link-input')).map(el => el.value.trim()).filter(Boolean);
    const links = [link, ...extraLinks].filter(Boolean).map(sanitizeShareUrlClient);
    const notes = document.getElementById('opt-notes').value.trim();
    if (!name) { document.getElementById('opt-name').focus(); return; }

    const btn = document.getElementById('add-option-btn');
    btn.disabled = true; btn.textContent = 'Adding…';
    try {
      const payload = {
        name, notes,
        link: links[0] || null,
        links,
        thumbnail: links[0] ? (draftThumbnail || null) : null,
        isDate: false,
        votes: {},
        createdAt: serverTimestamp()
      };
      if (hasSections(pollData)) payload.sectionId = activeSectionId;
      const docRef = await addDoc(collection(db, 'polls', pollId, 'options'), payload);
      const addedId = docRef.id;
      saveOptionName(name);
      pushHistory({
        label: `Add option: ${name}`,
        undo: () => deleteDoc(doc(db, 'polls', pollId, 'options', addedId)),
        redo: () => setDoc(doc(db, 'polls', pollId, 'options', addedId), payload),
      });
      toast('Added to the poll');
      draftName = '';
      draftLink = '';
      draftThumbnail = null;
      closeOverlay(closeAddPanel);
    } catch(e){
      toast(`Could not add option: ${e.message || 'unknown error'}`);
      console.error(e);
    } finally {
      btn.disabled = false; btn.textContent = 'Add to poll';
    }
  }

  async function addDateOptions(pollId, calState, onDone){
    const dates = Array.from(calState.selected).sort();
    if (!dates.length) return;
    const btn = document.getElementById('add-dates-btn');
    if (btn) { btn.disabled = true; btn.textContent = 'Adding…'; }
    try {
      const sectioned = hasSections(pollData);
      await Promise.all(dates.map(iso => addDoc(collection(db, 'polls', pollId, 'options'), {
        name: formatDateOption(iso),
        notes: '', link: null, isDate: true, dateISO: iso,
        votes: {}, createdAt: serverTimestamp(),
        ...(sectioned ? { sectionId: activeSectionId } : {})
      })));
      calState.selected.clear();
      toast(`Added ${dates.length} date${dates.length===1?'':'s'}`);
      closeOverlay(closeAddPanel);
    } catch (e) {
      toast(`Could not add dates: ${e.message || 'unknown error'}`);

  /* ---------- hide / un-hide a section tab ----------
     Distinct from deleting a section: hiding just tucks it out of the tab
     row (its options and votes are untouched, and it still counts toward
     MAX_SECTIONS since the data is still there). Triggered by a
     long-press on the tab pill that doesn't turn into a drag — see the
     touchend handler above. Un-hiding needs no confirmation since it's
     purely additive; hiding does, since it's an easy gesture to trigger
     by accident. */
  function toggleSectionHidden(pollId, pollData, s){
    if (s.hidden) {
      updateDoc(doc(db, 'polls', pollId), { [`sections.${s.id}.hidden`]: false }).catch(err => {
        toast(`Could not restore "${s.name}": ${err.message || 'unknown error'}`);
        console.error(err);
      });
      pushHistory({
        label: `Show tab: ${s.name}`,
        undo: () => updateDoc(doc(db, 'polls', pollId), { [`sections.${s.id}.hidden`]: true }),
        redo: () => updateDoc(doc(db, 'polls', pollId), { [`sections.${s.id}.hidden`]: false }),
      });
      toast(`"${s.name}" is visible again`);
      return;
    }
    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>Hide "${escapeHtml(s.name)}"?</h3>
        <p>Its options and votes stay exactly as they are — you can bring it back anytime from the ⋯ menu.</p>
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" id="hidesec-cancel" style="flex:1">Cancel</button>
          <button class="btn" id="hidesec-confirm" style="flex:1;background:var(--violet);color:#fff;">Hide tab</button>
        </div>
      </div>
    `;
    openModal(backdrop);
    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#hidesec-cancel').addEventListener('click', () => closeModal(backdrop));
    backdrop.querySelector('#hidesec-confirm').addEventListener('click', async () => {
      const btn = backdrop.querySelector('#hidesec-confirm');
      btn.disabled = true; btn.textContent = 'Hiding…';
      try {
        await updateDoc(doc(db, 'polls', pollId), { [`sections.${s.id}.hidden`]: true });
        closeModal(backdrop);
        pushHistory({
          label: `Hide tab: ${s.name}`,
          undo: () => updateDoc(doc(db, 'polls', pollId), { [`sections.${s.id}.hidden`]: false }),
          redo: () => updateDoc(doc(db, 'polls', pollId), { [`sections.${s.id}.hidden`]: true }),
        });
        toast(`Hid "${s.name}" — tap ↺ to undo`);
      } catch (err) {
        toast(`Could not hide "${s.name}": ${err.message || 'unknown error'}`);
        console.error(err);
        btn.disabled = false; btn.textContent = 'Hide tab';
      }
    });
  }

  /* ---------- add / rename a poll section ----------
     One modal handles both: existingSection === null means "add a new
     section", a section object means "rename/retype this one". Keeping
     both in one function (mirroring openEditTitleModal's pattern) means
     the two flows can't drift apart, and the deletion guard (only ever
     allowed when a section is already empty) lives in exactly one place.
     onCreated(newId) is only called after a successful ADD, so the caller
     can point activeSectionId at the section that was just made. */
  function openSectionModal(pollId, pollData, options, existingSection, onCreated, opts){
    const isRename = !!existingSection;
    const currentSections = sectionListOf(pollData);
    const optionCountInSection = isRename ? options.filter(o => o.sectionId === existingSection.id).length : 0;
    const canDelete = isRename && optionCountInSection === 0 && currentSections.length > 1;

    const backdrop = document.createElement('div');
    backdrop.className = 'modal-backdrop';
    backdrop.innerHTML = `
      <div class="modal">
        <h3>${isRename ? 'Rename section' : 'Add a section'}</h3>
        ${isRename ? '' : `<p>Existing options stay right where they are — this just adds a new voting tab alongside them.</p>`}
        <label class="field-label">Section name</label>
        <input id="section-name-input" class="field" placeholder="e.g. Dates" maxlength="30" value="${isRename ? escapeHtml(existingSection.name) : ''}" />
        <label class="field-label">Voting mode for this section</label>
        <div class="tab-row" style="margin-bottom:16px;">
          <button type="button" class="tab-btn" data-section-modal-multi="0">Single choice</button>
          <button type="button" class="tab-btn" data-section-modal-multi="1">Multiple choice</button>
        </div>
        ${isRename && optionCountInSection > 0 ? `<p style="font-size:12px;color:var(--text-muted);margin:-8px 0 8px;">This section has ${optionCountInSection} option${optionCountInSection===1?'':'s'}, so it can't be deleted — remove them first if you want to.</p>` : ''}
        <div style="display:flex;gap:10px;">
          <button class="btn btn-ghost" id="section-modal-cancel" style="flex:1">Cancel</button>
          <button class="btn btn-primary" id="section-modal-save" style="flex:1">${isRename ? 'Save' : 'Add section'}</button>
        </div>
        ${canDelete ? `<button class="btn btn-ghost btn-sm" id="section-modal-delete" style="width:100%;margin-top:10px;color:var(--rose);">🗑️ Delete this empty section</button>` : ''}
      </div>
    `;
    openModal(backdrop, opts);
    const nameInput = backdrop.querySelector('#section-name-input');
    nameInput.focus();
    if (isRename) nameInput.select();
    let multi = isRename ? !!existingSection.multiChoice : false;
    const multiBtns = backdrop.querySelectorAll('[data-section-modal-multi]');
    function paintMulti(){
      multiBtns.forEach(b => b.classList.toggle('active', (b.getAttribute('data-section-modal-multi') === '1') === multi));
    }
    paintMulti();
    multiBtns.forEach(b => b.addEventListener('click', () => { multi = b.getAttribute('data-section-modal-multi') === '1'; paintMulti(); }));

    backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
    backdrop.querySelector('#section-modal-cancel').addEventListener('click', () => closeModal(backdrop));

    backdrop.querySelector('#section-modal-save').addEventListener('click', async () => {
      const name = nameInput.value.trim();
      if (!name) { nameInput.focus(); return; }
      const btn = backdrop.querySelector('#section-modal-save');
      btn.disabled = true; btn.textContent = isRename ? 'Saving…' : 'Adding…';
      try {
        if (isRename) {
          await updateDoc(doc(db, 'polls', pollId), {
            [`sections.${existingSection.id}.name`]: name,
            [`sections.${existingSection.id}.multiChoice`]: multi,
          });
          toast('Section updated');
        } else {
          if (currentSections.length >= MAX_SECTIONS) { toast(`You can have up to ${MAX_SECTIONS} sections`); return; }
          const newId = `sec_${genId(6)}`;
          const wasUnsectioned = currentSections.length === 0;
          await updateDoc(doc(db, 'polls', pollId), {
            [`sections.${newId}`]: { name, multiChoice: multi, order: currentSections.length },
          });
          // First section ever added to a poll that already had plain
          // (un-sectioned) options: fold them into it, so they don't
          // silently vanish from view once tabs appear.
          if (wasUnsectioned) {
            const orphans = options.filter(o => !o.sectionId);
            if (orphans.length) {
              await Promise.all(orphans.map(o => updateDoc(doc(db, 'polls', pollId, 'options', o.id), { sectionId: newId })));
            }
          }
          toast(`Added "${name}"`);
          if (onCreated) onCreated(newId);
        }
        closeModal(backdrop);
      } catch (e) {
        toast(`Could not save section: ${e.message || 'unknown error'}`);
        btn.disabled = false; btn.textContent = isRename ? 'Save' : 'Add section';
        console.error(e);
      }
    });

    backdrop.querySelector('#section-modal-delete')?.addEventListener('click', async () => {
      const btn = backdrop.querySelector('#section-modal-delete');
      btn.disabled = true; btn.textContent = 'Deleting…';
      try {
        // Re-number remaining sections' order so there's no gap, and switch
        // off this section if it was the one currently being viewed.
        const remaining = currentSections.filter(s => s.id !== existingSection.id);
        const updates = { [`sections.${existingSection.id}`]: deleteField() };
        remaining.forEach((s, i) => { updates[`sections.${s.id}.order`] = i; });
        await updateDoc(doc(db, 'polls', pollId), updates);
        if (activeSectionId === existingSection.id) activeSectionId = remaining[0]?.id || null;
        closeModal(backdrop);
        toast('Section deleted');
      } catch (e) {
        toast(`Could not delete section: ${e.message || 'unknown error'}`);
        btn.disabled = false; btn.textContent = '🗑️ Delete this empty section';
        console.error(e);
      }
    });
  }

function voteCount(opt){ return Object.keys(opt.votes || {}).length; }

/* ---------- copy results as image ----------
   Renders the current results into an offscreen canvas styled to match
   the app, then copies it to the clipboard as a PNG so it can be pasted
   straight into a WhatsApp chat. Falls back to a downloaded file on
   browsers/contexts where clipboard image-write isn't available (e.g.
   some in-app browsers), so the feature still works, just one tap slower. */
/* ---------- results export ----------
   A plain, non-sectioned poll keeps the original one-tap "copy an image to
   clipboard, paste into WhatsApp" flow, unchanged. A sectioned poll instead
   produces one sharp HD image PER section (never one combined image) and
   hands them all to Android's native share sheet at once via the Web
   Share API, since the clipboard can only ever hold a single image —
   sharing multiple files together is what WhatsApp/Instagram actually
   support on Android. If file-sharing isn't available, each image
   downloads individually instead so nothing is silently skipped. */
async function shareOrCopyResults(pollData, options){
  const sectioned = hasSections(pollData);
  const caption = `Voted with YouVote: ${location.href}`;
  toast(sectioned ? 'Preparing images…' : 'Preparing image…');
  try {
    let files;
    if (sectioned) {
      const sections = sectionListOf(pollData);
      files = [];
      for (const s of sections) {
        const sectionOptions = options.filter(o => o.sectionId === s.id);
        const blob = await renderResultsBlob({ ...pollData, title: `${pollData.title} — ${s.name}` }, sectionOptions);
        const filename = `${slugify(pollData.title) || 'poll'}-${slugify(s.name) || 'section'}-results.png`;
        files.push(new File([blob], filename, { type: 'image/png' }));
      }
    } else {
      const blob = await renderResultsBlob(pollData, options);
      files = [new File([blob], `${slugify(pollData.title) || 'poll'}-results.png`, { type: 'image/png' })];
    }

    if (navigator.canShare && navigator.canShare({ files })) {
      try {
        await navigator.share({ files, title: pollData.title, text: caption });
        return;
      } catch (e) {
        if (e && e.name === 'AbortError') return; // user closed the share sheet — not an error
        console.error('Web Share failed, falling back:', e);
      }
    }

    if (files.length === 1 && navigator.clipboard && window.ClipboardItem) {
      try {
        // A single ClipboardItem can hold more than one representation —
        // pasting into an image-capable field (like a WhatsApp chat) picks
        // up the picture, pasting into a text field picks up the caption.
        const parts = { 'image/png': files[0], 'text/plain': new Blob([caption], { type: 'text/plain' }) };
        await navigator.clipboard.write([new window.ClipboardItem(parts)]);
        toast('Results image copied — paste it into WhatsApp!');
        return;
      } catch (e) {
        console.error('Clipboard write failed, falling back to download:', e);
      }
    }
    // Neither Web Share (with files) nor clipboard image-write is available
    // here — likely an older/OEM browser (common on lower-end Android
    // devices). A 2-second toast is easy to miss under the browser's own
    // "Download complete" system UI, so this is a real modal that stays up
    // until it's dismissed, setting expectations *before* the download
    // starts rather than describing it after the fact.
    openDownloadFallbackModal(files.length, () => {
      files.forEach(f => downloadBlob(f, f.name));
    });
  } catch (e) {
    toast(`Could not create results image${sectioned ? 's' : ''}: ${e.message || 'unknown error'}`);
    console.error(e);
  }
}

/* Shown only when this browser can do neither native file-sharing nor
   clipboard image-write — a real modal (not a toast) so the explanation
   survives whatever the browser's own download UI does next. */
function openDownloadFallbackModal(fileCount, onConfirm){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Can't share directly from this browser</h3>
      <p>This browser doesn't support sending images straight to WhatsApp, so I'll download ${fileCount} image${fileCount===1?'':'s'} to your device instead. Once ${fileCount===1?'it finishes':'they finish'}, open your Downloads or Gallery and share from there — same as sharing any photo.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="dl-fallback-cancel" style="flex:1">Cancel</button>
        <button class="btn btn-primary" id="dl-fallback-confirm" style="flex:1">Download image${fileCount===1?'':'s'}</button>
      </div>
    </div>
  `;
  openModal(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelector('#dl-fallback-cancel').addEventListener('click', () => closeModal(backdrop));
  backdrop.querySelector('#dl-fallback-confirm').addEventListener('click', () => {
    onConfirm();
    closeModal(backdrop);
  });
}
function downloadBlob(blob, filename){
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}

async function renderResultsBlob(pollData, options){
  // Wait for the webfonts to be ready so canvas text doesn't fall back to
  // a generic serif/sans-serif — this only resolves once, near-instant if
  // the fonts already loaded when the page did.
  try { await document.fonts.ready; } catch {}

  const W = 640;
  const PAD = 28;
  const ROW_H = 64;
  const HEADER_H = 96;
  const FOOTER_H = 44;
  const rows = options.length || 1;
  const H = HEADER_H + rows * ROW_H + FOOTER_H + PAD;

  const canvas = document.createElement('canvas');
  const scale = 4; // 4x for crisp, HD text even when zoomed in after sharing to WhatsApp
  canvas.width = W * scale; canvas.height = H * scale;
  const ctx = canvas.getContext('2d');
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.scale(scale, scale);

  const bg = '#141319', surface = '#1E1C27', border = '#4E4768', text = '#F5F3FA',
        textMuted = '#A39DB8', violet = '#A594F5', gold = '#EFB65C';

  // background
  ctx.fillStyle = bg;
  roundRect(ctx, 0, 0, W, H, 0); ctx.fill();

  // header
  ctx.fillStyle = text;
  ctx.font = "600 22px Fraunces, serif";
  ctx.textBaseline = 'alphabetic';
  wrapText(ctx, pollData.title || 'Poll results', PAD, 40, W - PAD * 2, 26);

  const totalVotes = options.reduce((sum, o) => sum + voteCount(o), 0);
  ctx.fillStyle = textMuted;
  ctx.font = "500 13px Inter, sans-serif";
  ctx.fillText(`${totalVotes} vote${totalVotes===1?'':'s'} total`, PAD, 68);

  let y = HEADER_H;
  if (!options.length) {
    ctx.fillStyle = textMuted;
    ctx.font = "500 14px Inter, sans-serif";
    ctx.fillText('No options were added to this poll.', PAD, y + 34);
    y += ROW_H;
  }
  options.forEach((opt) => {
    const count = voteCount(opt);
    const pct = totalVotes ? count / totalVotes : 0;
    const rowY = y;
    const barMaxW = W - PAD * 2;

    // row background
    ctx.fillStyle = surface;
    roundRect(ctx, PAD, rowY + 6, barMaxW, ROW_H - 16, 12); ctx.fill();
    ctx.strokeStyle = border; ctx.lineWidth = 1;
    roundRect(ctx, PAD, rowY + 6, barMaxW, ROW_H - 16, 12); ctx.stroke();

    // progress fill — bright violet at moderate opacity, not the old dim
    // violet-on-dark-surface combo (same low-contrast issue as the live
    // app's bars, fixed the same way, so a shared image matches what
    // people already see on their screen).
    const fillW = Math.max(0, Math.min(barMaxW, barMaxW * pct));
    if (fillW > 0) {
      ctx.save();
      roundRect(ctx, PAD, rowY + 6, barMaxW, ROW_H - 16, 12); ctx.clip();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = violet;
      ctx.fillRect(PAD, rowY + 6, fillW, ROW_H - 16);
      ctx.restore();
    }

    // option name
    ctx.fillStyle = text;
    ctx.font = "600 15px Inter, sans-serif";
    const label = truncateToWidth(ctx, opt.name || '', barMaxW - 130);
    ctx.fillText(label, PAD + 16, rowY + ROW_H / 2 + 5);

    // count + pct, right aligned
    ctx.textAlign = 'right';
    ctx.fillStyle = violet;
    ctx.font = "700 15px 'JetBrains Mono', monospace";
    ctx.fillText(`${count}`, W - PAD - 16, rowY + ROW_H / 2);
    ctx.fillStyle = textMuted;
    ctx.font = "500 11px Inter, sans-serif";
    ctx.fillText(`${Math.round(pct * 100)}%`, W - PAD - 16, rowY + ROW_H / 2 + 16);
    ctx.textAlign = 'left';

    y += ROW_H;
  });

  // footer credit
  ctx.fillStyle = textMuted;
  ctx.font = "500 11px Inter, sans-serif";
  ctx.textAlign = 'center';
  ctx.fillText('Made with YouVote · By YE Chew', W / 2, H - 16);
  ctx.textAlign = 'left';

  return new Promise((resolve, reject) => {
    canvas.toBlob((blob) => blob ? resolve(blob) : reject(new Error('Canvas produced no image data')), 'image/png');
  });
}

function roundRect(ctx, x, y, w, h, r){
  if (r === 0) { ctx.beginPath(); ctx.rect(x, y, w, h); return; }
  const rr = Math.min(r, w / 2, h / 2);
  ctx.beginPath();
  ctx.moveTo(x + rr, y);
  ctx.arcTo(x + w, y, x + w, y + h, rr);
  ctx.arcTo(x + w, y + h, x, y + h, rr);
  ctx.arcTo(x, y + h, x, y, rr);
  ctx.arcTo(x, y, x + w, y, rr);
  ctx.closePath();
}
function wrapText(ctx, str, x, y, maxWidth, lineHeight){
  const words = (str || '').split(' ');
  let line = '', lineY = y;
  for (let i = 0; i < words.length; i++) {
    const test = line ? line + ' ' + words[i] : words[i];
    if (ctx.measureText(test).width > maxWidth && line) {
      ctx.fillText(line, x, lineY);
      line = words[i]; lineY += lineHeight;
    } else {
      line = test;
    }
  }
  if (line) ctx.fillText(line, x, lineY);
}
function truncateToWidth(ctx, str, maxWidth){
  if (ctx.measureText(str).width <= maxWidth) return str;
  let s = str;
  while (s.length > 1 && ctx.measureText(s + '…').width > maxWidth) s = s.slice(0, -1);
  return s + '…';
}

        </div>

              }).join('')}
              <span class="vote-count-label">${count ? count + ' vote' + (count===1?'':'s') + (totalVotes ? ' · ' + pct + '%' : '') : 'No votes yet'}</span>

/* Reads an option's reference link(s), tolerating the old single-`link`
   shape from before multi-link support existed. */
/* Turns a raw URL into a short, recognizable label — the actual domain,
   with a couple of very common ones given a friendlier name — so a voter
   can tell what they're about to open instead of tapping a blind "Link 1". */
/* Client-side mirror of api/resolve-link.js's sanitizeShareUrl (Google
   Maps CID extraction + generic tracking-param stripping) — same logic,
   pure string/URL parsing, no network call. This exists so any link is
   guaranteed clean the moment it's saved, even if the paste-time server
   resolve never ran or hasn't finished yet (e.g. someone types a name
   and hits "Add" immediately after pasting). If the server-side version
   ever changes, update both — they intentionally stay in sync rather
   than sharing a module, since this is a single-file app with no build
   step. */
const TRACKING_PARAMS_CLIENT = new Set([
  'utm_source', 'utm_medium', 'utm_campaign', 'utm_term', 'utm_content', 'utm_id', 'utm_name', 'utm_reader',
  'fbclid', 'gclid', 'gclsrc', 'dclid', 'msclkid', 'twclid', 'ttclid',
  'igshid', 'igsh', 'mibextid',
  'si', 'feature',
  'ref', 'ref_src', 'ref_url',
  'mc_cid', 'mc_eid', 'spm',
  'share_id', 'is_copy_url', 'is_from_webapp', 'sender_device', 'share_app_id',
  '_ga', '_gl', 'trk', 'trkcampaign'
]);
function sanitizeShareUrlClient(u){
  if (!u) return u;
  if (/google\.[a-z.]+\/maps/i.test(u)) {
    const m = u.match(/!1s0x[0-9a-f]+:0x([0-9a-f]+)/i);
    if (m) {
      try { return `https://maps.google.com/?cid=${BigInt('0x' + m[1]).toString(10)}`; } catch { /* fall through */ }
    }
    return u.split('?')[0].split('/data=')[0];
  }
  try {
    const parsed = new URL(u);
    let changed = false;
    Array.from(parsed.searchParams.keys()).forEach(key => {
      if (TRACKING_PARAMS_CLIENT.has(key.toLowerCase())) { parsed.searchParams.delete(key); changed = true; }
    });
    return changed ? parsed.toString() : u;
  } catch {
    return u; // not a parseable absolute URL — leave untouched rather than risk mangling it
  }
}
function linkPreviewLabel(url){
  let hostname, pathname;
  try {
    const u = new URL(url);
    hostname = u.hostname.replace(/^www\./, '');
    pathname = u.pathname;
  } catch { return (url || '').slice(0, 24); }
  if (hostname === 'google.com') {
    if (pathname.startsWith('/maps')) return 'Google Maps';
    if (pathname.startsWith('/search')) return 'Google Search';
    return 'Google';
  }
  const known = {
    'maps.google.com': 'Google Maps', 'goo.gl': 'Google Maps', 'maps.app.goo.gl': 'Google Maps',
    'instagram.com': 'Instagram', 'xiaohongshu.com': 'XHS', 'xhslink.com': 'XHS',
    'tiktok.com': 'TikTok', 'facebook.com': 'Facebook', 'fb.watch': 'Facebook',
  };
  return known[hostname] || hostname;
}
/* A real photo thumbnail isn't possible for Maps/Instagram/XHS/TikTok —
   same reason their names can't be scraped either (bot walls, JS-rendered
   content). A small platform icon fills that gap so an option still reads
   at a glance instead of showing nothing. Only used when there's no real
   og:image thumbnail to show. */
function linkPreviewIcon(url){
  let hostname, pathname;
  try {
    const u = new URL(url);
    hostname = u.hostname.replace(/^www\./, '');
    pathname = u.pathname;
  } catch { return null; }
  if (hostname === 'google.com') {
    if (pathname.startsWith('/maps')) return '📍';
    if (pathname.startsWith('/search')) return '🔍';
    return '🔎';
  }
  const icons = {
    'maps.google.com': '📍', 'goo.gl': '📍', 'maps.app.goo.gl': '📍',
    'instagram.com': '📷', 'xiaohongshu.com': '📕', 'xhslink.com': '📕',
    'tiktok.com': '🎵', 'facebook.com': '📘', 'fb.watch': '📘',
  };
  return icons[hostname] || null;
}
/* Small thumbnail shown in the collapsed option row: a real photo when
   resolve-link.js managed to pull one (ordinary article/restaurant sites),
   otherwise nothing — a placeholder platform icon (📍/📷/etc.) was tried
   before but added visual noise without helping anyone actually decide
   how to vote, so it was dropped. */
function optionThumbHtml(opt){
  if (opt.thumbnail) {
    return `<div class="opt-thumb"><img src="${escapeHtml(opt.thumbnail)}" alt="" loading="lazy" onerror="this.parentElement.remove()"/></div>`;
  }
  return '';
}
function optionLinks(opt){
  if (Array.isArray(opt.links) && opt.links.length) return opt.links.filter(Boolean);
  const legacy = opt.link ?? opt.mapsUri ?? null;
  return legacy ? [legacy] : [];
}

        <button id="clear-link-btn" class="link-clear-btn" type="button" aria-label="Clear link">✕</button>

          <button type="button" class="field-x field-x-textarea" data-clear="opt-notes" aria-label="Clear notes">✕</button>
        </div>
