function calendarPickerHtml(calState){
  const { month, selected } = calState;
  const year = month.getFullYear(), m = month.getMonth();
  const first = new Date(year, m, 1);
  const startWeekday = first.getDay();
  const daysInMonth = new Date(year, m + 1, 0).getDate();
  const todayISO = new Date().toISOString().slice(0, 10);
  const monthLabel = `${MONTHS[m]} ${year}`;

  let cells = '';
  for (let i = 0; i < startWeekday; i++) cells += `<div class="cal-cell empty"></div>`;
  for (let day = 1; day <= daysInMonth; day++) {
    const iso = `${year}-${String(m+1).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const isPast = iso < todayISO;
    const isSelected = selected.has(iso);
    cells += `<button class="cal-cell ${isSelected ? 'selected' : ''} ${isPast ? 'past' : ''}" data-cal-day="${iso}" ${isPast ? 'disabled' : ''}>${day}</button>`;
  }

  return `
    <div class="cal-header">
      <button class="chip chip-icon-only" id="cal-prev" aria-label="Previous month">‹</button>
      <span class="cal-month">${monthLabel}</span>
      <button class="chip chip-icon-only" id="cal-next" aria-label="Next month">›</button>
    </div>
    <div class="cal-weekdays"><div>S</div><div>M</div><div>T</div><div>W</div><div>T</div><div>F</div><div>S</div></div>
    <div class="cal-grid">${cells}</div>
    <button id="add-dates-btn" class="btn btn-primary" ${selected.size === 0 ? 'disabled' : ''}>
      Add ${selected.size || ''} date${selected.size === 1 ? '' : 's'}
    </button>
  `;
}

/* ---------- delete poll modal (home page, with undo) ---------- */
function openDeletePollModal(pollId, title){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Delete "${escapeHtml(title)}"?</h3>
      <p>This removes the poll and every vote for everyone. You can undo right after.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="delete-cancel" style="flex:1">Cancel</button>
        <button class="btn" id="delete-confirm" style="flex:1;background:var(--rose);color:#fff;">Delete poll</button>
      </div>
    </div>
  `;
  openModal(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelector('#delete-cancel').addEventListener('click', () => closeModal(backdrop));
  backdrop.querySelector('#delete-confirm').addEventListener('click', async () => {
    const btn = backdrop.querySelector('#delete-confirm');
    btn.disabled = true; btn.textContent = 'Deleting…';
    try {
      const pollSnap = await getDoc(doc(db, 'polls', pollId));
      const savedPollData = pollSnap.exists() ? pollSnap.data() : { title, createdAt: serverTimestamp(), closed: false, multiChoice: false };
      const optsSnap = await getDocs(collection(db, 'polls', pollId, 'options'));
      const savedOptions = optsSnap.docs.map(d => ({ id: d.id, data: d.data() }));

      await Promise.all(optsSnap.docs.map(d => deleteDoc(d.ref)));
      await deleteDoc(doc(db, 'polls', pollId));
      removeRecent(pollId);

      closeModal(backdrop);
      showUndoBanner(`Deleted "${title}"`, async () => {
        await setDoc(doc(db, 'polls', pollId), savedPollData);
        await Promise.all(savedOptions.map(o => setDoc(doc(db, 'polls', pollId, 'options', o.id), o.data)));
        addRecent(pollId, savedPollData.title || title);
        renderHome();
      });
      renderHome();
    } catch (e) {
      toast(`Could not delete poll: ${e.message || 'unknown error'}`);
      btn.disabled = false; btn.textContent = 'Delete poll';
      console.error(e);
    }
  });
}

async function castVote(pollId, options, optId, multiChoice){
  const voter = getVoter();
  const voterKey = voter.id;
  const target = options.find(o => o.id === optId);
  const alreadyVoted = target?.votes?.[voterKey];

  if (multiChoice) {
    await updateDoc(doc(db, 'polls', pollId, 'options', optId), {
      [`votes.${voterKey}`]: alreadyVoted ? deleteField() : { name: voter.name, initials: voter.initials }
    });
    return;
  }

  const updates = options.map(async (opt) => {
    const has = opt.votes && opt.votes[voterKey];
    if (opt.id === optId) {
      return updateDoc(doc(db, 'polls', pollId, 'options', opt.id), {
        [`votes.${voterKey}`]: alreadyVoted ? deleteField() : { name: voter.name, initials: voter.initials }
      });
    } else if (has) {
      return updateDoc(doc(db, 'polls', pollId, 'options', opt.id), { [`votes.${voterKey}`]: deleteField() });
    }
  });
  await Promise.all(updates);
}

/* ---------- voter name prompt ----------
   priorOptions (optional): the poll's current options, used only to offer
   a quick "is this you?" pick from names that already voted in this poll —
   so a fresh device identity (e.g. after clearing site data) can rejoin an
   existing identity instead of always minting a new one. */
function askVoterName(onDone, priorOptions){
  const existing = getVoter();
  const candidates = [];
  if (!existing && priorOptions && priorOptions.length) {
    const seen = new Set();
    priorOptions.forEach(opt => {
      Object.entries(opt.votes || {}).forEach(([vid, v]) => {
        if (seen.has(vid)) return;
        seen.add(vid);
        candidates.push([vid, v.name]);
      });
    });
  }
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>${existing ? 'Edit your name' : "What's your name?"}</h3>
      <p>Shown next to your vote so friends know who picked what. Saved on this device only.${existing ? ' Renaming keeps all your existing votes — it just relabels them.' : ''}</p>
      ${candidates.length ? `
        <p style="font-size:12px;color:var(--text-muted);margin:-8px 0 8px;">Voted here before under a different name? Tap it to pick up where you left off — or type a new name below.</p>
        <div class="chip-row" style="margin-bottom:14px;">
          ${candidates.map(([vid, name]) => `<button type="button" class="chip" data-claim-quick="${vid}" data-claim-name="${escapeHtml(name)}">${escapeHtml(name)}</button>`).join('')}
        </div>
      ` : ''}
      <input id="voter-name-input" class="field" placeholder="e.g. Pikachew" maxlength="20" value="${existing ? escapeHtml(existing.name) : ''}" />
      <button class="btn btn-primary" id="voter-name-save">${existing ? 'Save' : 'Continue'}</button>
    </div>
  `;
  openModal(backdrop);
  const input = backdrop.querySelector('#voter-name-input');
  input.focus();
  if (existing) input.select();
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelectorAll('[data-claim-quick]').forEach(btn => {
    btn.addEventListener('click', () => {
      const vid = btn.getAttribute('data-claim-quick');
      const name = btn.getAttribute('data-claim-name');
      localStorage.setItem('poll_voter_id', vid);
      const v = { id: vid, name, initials: initialsOf(name) };
      localStorage.setItem('poll_voter', JSON.stringify(v));
      closeModal(backdrop);
      if (onDone) onDone(v);
    });
  });
  backdrop.querySelector('#voter-name-save').addEventListener('click', () => {
    const name = input.value.trim();
    if (!name) { input.focus(); return; }
    const voter = setVoter(name);
    closeModal(backdrop);
    if (onDone) onDone(voter);
  });
}

/* ---------- claim/merge a duplicate identity ----------
   Workaround for the "cleared my cache and now I'm a new person" problem:
   lets someone fold an earlier identity's votes into their current one. */
function openMergeIdentityModal(pollId, options, pollData, voter){
  const currentId = voter.id;
  const seen = new Map();
  options.forEach(opt => {
    Object.entries(opt.votes || {}).forEach(([vid, v]) => {
      if (vid === currentId) return;
      const rec = seen.get(vid) || { name: v.name, count: 0 };
      rec.name = v.name;
      rec.count++;
      seen.set(vid, rec);
    });
  });
  const candidates = [...seen.entries()];
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Claim votes from a previous name</h3>
      <p>If you voted here before under a different name (e.g. after clearing your browser data), pick it below to move those votes to your current name, "${escapeHtml(voter.name)}".</p>
      ${candidates.length ? `
        <div style="display:flex;flex-direction:column;gap:8px;">
          ${candidates.map(([vid, rec]) => `
            <button type="button" class="menu-item" style="border:1px solid var(--border);border-radius:var(--radius-sm);display:flex;justify-content:space-between;" data-claim-id="${vid}">
              <span>${escapeHtml(rec.name)}</span><span style="color:var(--text-muted);">${rec.count} vote${rec.count===1?'':'s'}</span>
            </button>
          `).join('')}
        </div>
      ` : `<p style="margin-top:-8px;">No other names have voted in this poll yet.</p>`}
    </div>
  `;
  openModal(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelectorAll('[data-claim-id]').forEach(btn => {
    btn.addEventListener('click', () => {
      const vid = btn.getAttribute('data-claim-id');
      const rec = seen.get(vid);
      closeModal(backdrop);
      openConfirmClaimModal(pollId, options, pollData, voter, vid, rec);
    });
  });
}
function openConfirmClaimModal(pollId, options, pollData, voter, oldId, rec){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Claim "${escapeHtml(rec.name)}"'s votes?</h3>
      <p>Moves ${rec.count} vote${rec.count===1?'':'s'} to your current name, "${escapeHtml(voter.name)}", and removes the duplicate. Can't be undone.</p>
      <div style="display:flex;gap:10px;">
        <button class="btn btn-ghost" id="claim-cancel" style="flex:1">Cancel</button>
        <button class="btn btn-primary" id="claim-confirm" style="flex:1;">Claim votes</button>
      </div>
    </div>
  `;
  openModal(backdrop);
  backdrop.addEventListener('click', (e) => { if (e.target === backdrop) closeModal(backdrop); });
  backdrop.querySelector('#claim-cancel').addEventListener('click', () => closeModal(backdrop));
  backdrop.querySelector('#claim-confirm').addEventListener('click', async () => {
    const btn = backdrop.querySelector('#claim-confirm');
    btn.disabled = true; btn.textContent = 'Claiming…';
    try {
      const { moved } = await mergeVoterIdentity(pollId, options, pollData.multiChoice, oldId, voter);
      closeModal(backdrop);
      toast(moved ? `Claimed ${moved} vote${moved===1?'':'s'} from ${rec.name}` : `Removed duplicate — you'd already voted here`);
    } catch (e) {
      toast(`Could not claim votes: ${e.message || 'unknown error'}`);
      btn.disabled = false; btn.textContent = 'Claim votes';
      console.error(e);
    }
  });
}
async function mergeVoterIdentity(pollId, options, multiChoice, oldId, currentVoter){
  const currentId = currentVoter.id;
  const currentHasAnyVote = options.some(o => o.votes && o.votes[currentId]);
  const ops = [];
  let moved = 0;
  for (const opt of options) {
    const oldVote = opt.votes && opt.votes[oldId];
    if (!oldVote) continue;
    if (!multiChoice && currentHasAnyVote) {
      // Single-choice poll and this identity already has its one pick —
      // don't overwrite it, just clear the stale duplicate.
      ops.push(updateDoc(doc(db, 'polls', pollId, 'options', opt.id), { [`votes.${oldId}`]: deleteField() }));
      continue;
    }
    ops.push(updateDoc(doc(db, 'polls', pollId, 'options', opt.id), {
      [`votes.${currentId}`]: { name: currentVoter.name, initials: currentVoter.initials },
      [`votes.${oldId}`]: deleteField()
    }));
    moved++;
  }
  await Promise.all(ops);
  return { moved };
}
